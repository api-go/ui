<Pane scroll="none">
 <div slot="header"><PageHeader $.state.title="adminInfo().title" $.state.description="adminPage()==='customer-workspace'?'':adminInfo().description"><template slot="actions"><div class="dropdown" $if="['customers','customer-workspace'].includes(adminPage())"><button type="button" class="btn btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">{#数据操作#}</button><ul class="dropdown-menu dropdown-menu-end"><li><button class="dropdown-item" type="button" $onclick="adminGo({adminPage:'customer-import'})">{#导入客户#}</button></li><li><button class="dropdown-item" type="button" $onclick="adminGo({adminPage:'customer-export'})">{#导出客户#}</button></li><li><button class="dropdown-item" type="button" $onclick="adminGo({adminPage:'customer-create'})">{#分步创建客户#}</button></li></ul></div><button type="button" class="btn btn-link text-body-secondary" $if="adminPage()==='customer-detail'&&!globalThis.templateHost?.headerBack" $onclick="adminGo({adminPage:'customers'})"><i class="bi bi-arrow-left me-1" aria-hidden="true"></i>{#返回客户列表#}</button><button type="button" class="btn btn-primary" $aria-label="'{#新建客户#}'" $if="['customers','customer-workspace'].includes(adminPage())" $onclick="adminGo({adminPage:'customer-edit'})"><i class="bi bi-plus-lg me-sm-1" aria-hidden="true"></i><span class="d-none d-sm-inline">{#新建客户#}</span></button><button type="button" class="btn btn-primary" $if="adminPage()==='customer-detail'&&adminCustomer()" $onclick="adminGo({adminPage:'customer-edit',adminId:Hash.adminId})">{#编辑客户#}</button></template></PageHeader>
  <div class="alert alert-danger mt-3 mb-0" role="alert" $if="admin_state.error" $text="admin_state.error"></div><div class="small text-success-emphasis mt-2" role="status" $if="admin_state.notice" $text="admin_state.notice"></div>
  <div class="d-flex flex-wrap align-items-center gap-2 small mt-2" $if="adminDirty()"><span class="text-body-secondary">{#有未保存的草稿；切换布局会保留。#}</span><button type="button" class="btn btn-link py-0 px-1" $onclick="adminResumeDraft()">{#继续编辑#}</button></div>
 </div>
 <div slot="content" class="d-flex flex-column overflow-hidden">
  <View class="d-flex flex-column flex-fill overflow-hidden" file="../views/customers/create.html" $if="adminPage()==='customer-create'" $onerror="adminViewFailure(event)" $onready="adminViewReady(event)"></View>
  <View class="d-flex flex-column flex-fill overflow-hidden" file="../../mobile/views/more.html" $if="adminPage()==='mobile-more'" $onerror="adminViewFailure(event)" $onready="adminViewReady(event)"></View>
  <View class="d-flex flex-column flex-fill overflow-hidden" file="../views/customers/import.html" $if="adminPage()==='customer-import'" $onerror="adminViewFailure(event)" $onready="adminViewReady(event)"></View>
  <View class="d-flex flex-column flex-fill overflow-hidden" file="../views/customers/export.html" $if="adminPage()==='customer-export'" $onerror="adminViewFailure(event)" $onready="adminViewReady(event)"></View>
  <View class="d-flex flex-column flex-fill overflow-hidden" file="../views/tasks/list.html" $if="adminPage()==='tasks'" $onerror="adminViewFailure(event)" $onready="adminViewReady(event)"></View>
  <View class="d-flex flex-column flex-fill overflow-hidden" file="../views/tasks/detail.html" $if="adminPage()==='task-detail'" $onerror="adminViewFailure(event)" $onready="adminViewReady(event)"></View>
  <View $onerror="adminViewFailure(event)" $onready="adminViewReady(event)" class="d-flex flex-column flex-fill overflow-hidden" file="../views/home.html" $if="adminPage()==='home'"></View>
  <View $onerror="adminViewFailure(event)" $onready="adminViewReady(event)" class="d-flex flex-column flex-fill overflow-hidden" file="../views/customers/list.html" $if="adminPage()==='customers'"></View>
  <View $onerror="adminViewFailure(event)" $onready="adminViewReady(event)" class="d-flex flex-column flex-fill overflow-hidden" file="../views/customers/workspace.html" $if="adminPage()==='customer-workspace'"></View>
  <View $onerror="adminViewFailure(event)" $onready="adminViewReady(event)" class="d-flex flex-column flex-fill overflow-hidden" file="../views/customers/detail.html" $if="adminPage()==='customer-detail'"></View>
  <View $onerror="adminViewFailure(event)" $onready="adminViewReady(event)" class="d-flex flex-column flex-fill overflow-hidden" file="../views/customers/edit.html" $if="adminPage()==='customer-edit'"></View>
  <View $onerror="adminViewFailure(event)" $onready="adminViewReady(event)" class="d-flex flex-column flex-fill overflow-hidden" file="../views/orders/list.html" $if="adminPage()==='orders'"></View>
  <View $onerror="adminViewFailure(event)" $onready="adminViewReady(event)" class="d-flex flex-column flex-fill overflow-hidden" file="../views/orders/detail.html" $if="adminPage()==='order-detail'"></View>
  <View $onerror="adminViewFailure(event)" $onready="adminViewReady(event)" class="d-flex flex-column flex-fill overflow-hidden" file="../views/history.html" $if="adminPage()==='history'"></View>
  <View $onerror="adminViewFailure(event)" $onready="adminViewReady(event)" class="d-flex flex-column flex-fill overflow-hidden" file="../views/settings/profile.html" $if="adminPage()==='profile'"></View>
  <View $onerror="adminViewFailure(event)" $onready="adminViewReady(event)" class="d-flex flex-column flex-fill overflow-hidden" file="../views/settings/preferences.html" $if="adminPage()==='preferences'"></View>
  <View $onerror="adminViewFailure(event)" $onready="adminViewReady(event)" class="d-flex flex-column flex-fill overflow-hidden" file="../views/states/examples.html" $if="adminPage()==='states'"></View>
  <View $onerror="adminViewFailure(event)" $onready="adminViewReady(event)" class="d-flex flex-column flex-fill overflow-hidden" file="../views/guide.html" $if="adminPage()==='guide'"></View>
  <View $onerror="adminViewFailure(event)" $onready="adminViewReady(event)" class="d-flex flex-column flex-fill overflow-hidden" file="../views/states/not-found.html" $if="adminPage()==='missing'"></View>
 </div>
</Pane>

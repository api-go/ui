<Pane scroll="auto">
<PageHeader slot="header" heading="{#我的收藏#}" $.state.description="''">
<template slot="actions">
</template>
</PageHeader>
<div slot="content" class="p-3 p-md-4">
<div class="row g-3">
<article class="col-12 col-md-6" $each="content_state.data.articles.filter(x=>content_state.data.collections.includes(x.id))" as="article" key="id">
<div class="border rounded p-3">
<span class="small text-body-secondary" $text="article.category">
</span>
<h2 class="h5 mt-2">
<button class="btn btn-link p-0 text-start" $text="article.name" $onclick="contentGo('article',article.id)">
</button>
</h2>
<span class="small text-body-secondary" $text="article.author">
</span>
</div>
</article>
</div>
<p class="text-body-secondary p-3" $if="!content_state.data.collections.length">{#还没有收藏，打开文档后可以收藏。#}</p>
</div>
</Pane>

<Pane>
 <form slot="toolbar" class="d-flex gap-2" $onsubmit="event.preventDefault();Hash.go({adminTaskSearch:admin_state.taskSearch||null})"><input class="form-control" type="search" aria-label="{#搜索任务#}" placeholder="{#搜索任务#}" $bind="admin_state.taskSearch"><button class="btn btn-primary text-nowrap" type="submit" aria-label="{#搜索#}"><i class="bi bi-search me-sm-1" aria-hidden="true"></i><span class="d-none d-sm-inline">{#搜索#}</span></button></form>
 <div slot="content" class="p-3"><p class="small text-body-secondary">{#最近30次本机结果。复制链接只恢复任务编号，其他浏览器没有本机结果时会显示恢复入口。#}</p><div class="list-group"><button type="button" class="list-group-item list-group-item-action py-3" $each="adminVisibleTasks()" as="task" key="id" $onclick="adminGo({adminPage:'task-detail',adminTask:task.id})"><span class="d-flex flex-wrap justify-content-between gap-2"><strong $text="task.label"></strong><span class="badge" $class="task.status==='partial'?'bg-warning-subtle text-warning-emphasis':'bg-success-subtle text-success-emphasis'" $text="task.status==='partial'?'{#部分完成#}':'{#已完成#}'"></span></span><span class="d-block text-body-secondary small mt-1 text-break" $text="adminDate(task.time)+' · '+task.count+' {#项完成#}'"></span></button></div><div class="py-4 text-body-secondary" $if="!adminVisibleTasks().length"><h2 class="h6">{#暂无匹配的任务#}</h2><p>{#导入客户、生成导出或批量跟进后，可在这里查看结果。#}</p><button class="btn btn-outline-secondary" type="button" $onclick="adminGo({adminPage:'customers'})">{#浏览客户#}</button></div></div>
</Pane>

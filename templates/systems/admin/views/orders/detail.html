<div class="flex-fill overflow-auto p-3 p-md-4">
 <template $if="adminOrder()"><h2 class="h4 mb-1" $text="adminOrder()?.title"></h2><p class="text-body-secondary mb-4" $text="Hash.adminId"></p><dl class="row g-3"><div class="col-12 col-md-6"><dt class="small fw-normal text-body-secondary mb-1">{#订单金额#}</dt><dd class="h4" $text="adminMoney(adminOrder()?.amount)"></dd></div><div class="col-12 col-md-6"><dt class="small fw-normal text-body-secondary mb-1">{#当前状态#}</dt><dd $text="adminOrder()?.status"></dd></div><div class="col-12 col-md-6"><dt class="small fw-normal text-body-secondary mb-1">{#客户#}</dt><dd><button type="button" class="btn btn-link p-0 text-start" $onclick="adminGo({adminPage:'customer-detail',adminId:adminOrder()?.customerId})" $text="admin_state.data.customers.find(item=>item.id===adminOrder()?.customerId)?.name||'{#查看客户#}'"></button></dd></div><div class="col-12 col-md-6"><dt class="small fw-normal text-body-secondary mb-1">{#日期#}</dt><dd $text="adminOrder()?.date"></dd></div><div class="col-12"><dt class="small fw-normal text-body-secondary mb-1">{#说明#}</dt><dd class="text-break" $text="adminOrder()?.notes"></dd></div></dl><div class="d-flex flex-wrap gap-2 border-top pt-3"><button class="btn btn-primary" type="button" $if="['待确认','进行中'].includes(adminOrder()?.status)" $disabled="admin_state.saving" $onclick="adminOrderAdvance()" $text="adminOrder()?.status==='待确认'?'{#确认订单#}':'{#标记完成#}'"></button><button class="btn btn-outline-danger" type="button" $if="['待确认','进行中'].includes(adminOrder()?.status)" $disabled="admin_state.saving" $onclick="adminOrderCancel()">{#取消订单#}</button><button $if="!globalThis.templateHost?.headerBack" class="btn btn-outline-secondary" type="button" $onclick="adminGo({adminPage:'orders'})">{#返回订单列表#}</button></div><p class="small text-body-secondary mt-3">{#状态修改只影响当前浏览器示例，不触发支付、发货或其他外部业务。#}</p></template>
 <div class="alert alert-warning" $if="!adminOrder()"><h2 class="h6">{#订单不存在#}</h2><button $if="!globalThis.templateHost?.headerBack" class="btn btn-outline-secondary" type="button" $onclick="adminGo({adminPage:'orders'})">{#返回订单列表#}</button></div>
</div>

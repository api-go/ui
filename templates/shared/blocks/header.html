<div class="d-flex align-items-center flex-nowrap gap-2 w-100">
<button class="btn btn-link text-body-secondary px-1 flex-shrink-0" type="button" $if="templateApp.parent()" aria-label="{#返回上一级#}" $onclick="templateApp.go(templateApp.parent())"><i class="bi bi-chevron-left" aria-hidden="true"></i></button>
<button class="btn btn-link px-1 py-1 text-body fw-semibold text-nowrap flex-shrink-0" $class="templateApp.parent()?'d-none d-md-inline-flex':''" type="button" $aria-label="templateApp.title" $onclick="templateApp.go(templateApp.routes[0].id)"><i class="text-primary me-md-2" $class="'bi bi-'+templateApp.icon" aria-hidden="true"></i><span class="d-none d-md-inline" $text="templateApp.title"></span></button>
<Nav class="flex-fill" $if="templateApp.layout()==='topnav'" .changebind="*" $.state.list="templateApp.routes.filter(route=>route.icon).map(route=>({type:'button',name:route.id,label:route.title,icon:route.icon,class:templateApp.id==='website'?'bg-transparent text-body-emphasis':''}))" $.state.value="templateApp.active()" $onchange="templateApp.go(event.detail)"></Nav>
<span class="flex-fill" $if="templateApp.layout()!=='topnav'"></span>
<div class="dropdown flex-shrink-0"><button class="btn btn-link text-body-secondary px-1" type="button" aria-label="{#外观设置#}" title="{#外观设置#}" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false"><i class="bi bi-sliders2" aria-hidden="true"></i></button>
<div class="dropdown-menu dropdown-menu-end p-3"><h2 class="h6 mb-3">{#模板显示#}</h2>
<label class="d-block mb-3" $if="templateApp.layouts.length>1"><span class="form-label">{#布局版本#}</span><select class="form-select" aria-label="{#布局版本#}" $.value="templateApp.layout()" $onchange="Hash.go({[templateApp.id+'Layout']:event.target.value})"><option $each="templateApp.layouts" as="layout" $value="layout" $text="({sidebar:'{#侧栏#}',topnav:'{#顶部#}',adaptive:'{#自适应#}'})[layout]"></option></select></label>
<label class="d-block mb-3"><span class="form-label">{#界面密度#}</span><select class="form-select" aria-label="{#界面密度#}" $.value="LocalStorage.templateDensity||'default'" $onchange="LocalStorage.templateDensity=event.target.value"><option value="default">{#默认#}</option><option value="sm">{#紧凑#}</option><option value="lg">{#宽松#}</option></select></label>
<label class="d-flex align-items-center gap-2 mb-3"><input class="form-check-input mt-0" type="checkbox" $bind="LocalStorage.templateLink"><span>{#链接外观#}</span></label>
<button class="btn btn-link text-body-secondary d-flex align-items-center gap-2 px-0 w-100" aria-label="{#切换主题#}" type="button" $aria-pressed="LocalStorage.templateDark?'true':'false'" $onclick="LocalStorage.templateDark=!LocalStorage.templateDark"><i class="bi bi-circle-half" aria-hidden="true"></i><span>{#深色模式#}</span></button>
<div class="border-top mt-2 pt-2"><button class="btn btn-link text-body-secondary d-flex align-items-center gap-2 px-0 w-100 text-start" aria-label="{#返回模板目录#}" type="button" $onclick="templateExit()"><i class="bi bi-grid" aria-hidden="true"></i><span>{#返回模板目录#}</span></button></div>
</div></div></div>

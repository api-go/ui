<Pane scroll="auto">
<PageHeader slot="header" heading="{#单据详情#}" $.state.description="''">
<template slot="actions"></template>
</PageHeader>
<div slot="content" class="p-3 p-md-4">
<template $if="inventoryDocument()">
<div class="d-flex flex-wrap justify-content-between gap-3 mb-4">
<div>
<h2 class="h4" $text="inventoryDocument()?.name">
</h2>
<span class="text-body-secondary" $text="inventoryDocument()?.id">
</span>
</div>
<span class="badge align-self-start bg-secondary-subtle text-secondary-emphasis" $text="inventoryDocument()?.status">
</span>
</div>
<dl class="row g-3">
<div class="col-6">
<dt>{#仓库#}</dt>
<dd $text="inventoryWarehouse(inventoryDocument()?.warehouse)">
</dd>
</div>
<div class="col-6">
<dt>{#日期#}</dt>
<dd $text="inventoryDocument()?.date">
</dd>
</div>
</dl>
<div class="table-responsive">
<table class="table align-middle text-nowrap">
<thead>
<tr>
<th scope="col">{#商品#}</th>
<th scope="col">{#数量#}</th>
<th scope="col">{#单价#}</th>
<th scope="col">{#金额#}</th>
</tr>
</thead>
<tbody>
<tr $each="inventoryDocument()?.lines||[]" as="row" key="id">
<td class="" $text="row.name">
</td>
<td class="text-end" $text="row.qty">
</td>
<td class="text-end" $text="templateMoney(row.price)">
</td>
<td class="text-end" $text="templateMoney(Math.round(row.price*100)*row.qty/100)">
</td>
</tr>
</tbody>
</table>
</div>
<div class="text-end fs-4" $text="templateMoney(inventoryDocument()?.total)">
</div>
<p class="text-body-secondary mt-3" $text="inventoryDocument()?.notes">
</p>
<div class="d-flex flex-wrap gap-2 mt-4">
<button type="button" class="btn btn-primary" $onclick="inventoryPost()" $if="inventoryDocument()?.status==='草稿'" $disabled="inventory_state.saving||inventory_state.posting">{#确认过账#}</button>
<button type="button" class="btn btn-outline-secondary" $onclick="inventoryGo('editor',Hash.inventoryId)" $if="inventoryDocument()?.status==='草稿'">{#修改草稿#}</button>
<button type="button" class="btn btn-outline-secondary" $onclick="templateDownload('document.json',inventoryDocument())" >{#下载单据#}</button>
</div>
</template>
<div class="alert alert-warning" $if="!inventoryDocument()">{#单据不存在，请返回列表选择。#}</div>
</div>
</Pane>

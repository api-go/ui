<Pane scroll="auto">
<PageHeader slot="header" heading="{#预约记录#}" $.state.description="''">
<template slot="actions">
<button type="button" class="btn btn-primary" $onclick="bookingGo('editor')" >
<i class="bi bi-plus-lg me-1" aria-hidden="true">
</i>{#创建预约#}</button>
</template>
</PageHeader>
<div slot="content" class="p-3 p-md-4">
<div class="table-responsive">
<table class="table align-middle text-nowrap">
<thead>
<tr>
<th scope="col">{#预约#}</th>
<th scope="col">{#资源#}</th>
<th scope="col">{#日期与时段#}</th>
<th scope="col">{#状态#}</th>
</tr>
</thead>
<tbody>
<tr $each="booking_state.data.appointments" as="row" key="id">
<td>
<button class="btn btn-link p-0 text-start" $text="row.name" $onclick="bookingGo('detail',row.id)">
</button>
</td>
<td class="" $text="bookingResource(row.resourceId)?.name">
</td>
<td class="" $text="row.date+' '+row.start+'–'+row.end">
</td>
<td class="" $text="row.status">
</td>
</tr>
</tbody>
</table>
</div>
</div>
</Pane>

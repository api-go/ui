<Pane scroll="auto">
<PageHeader slot="header" heading="{#我的订单#}" $.state.description="''">
<template slot="actions">
</template>
</PageHeader>
<div slot="content" class="p-3 p-md-4">
<div class="table-responsive">
<table class="table align-middle text-nowrap">
<thead>
<tr>
<th scope="col">{#订单#}</th>
<th scope="col">{#金额#}</th>
<th scope="col">{#状态#}</th>
<th scope="col">{#时间#}</th>
</tr>
</thead>
<tbody>
<tr $each="commerce_state.data.orders" as="row" key="id">
<td>
<button class="btn btn-link p-0 text-start" $text="row.id" $onclick="commerceGo('order-detail',row.id)">
</button>
</td>
<td class="text-end" $text="templateMoney(row.total)">
</td>
<td class="" $text="row.status">
</td>
<td class="" $text="templateDate(row.time)">
</td>
</tr>
</tbody>
</table>
</div>
<p class="text-body-secondary p-3" $if="!commerce_state.data.orders.length">{#暂无订单，先从商品列表挑选商品。#}</p>
</div>
</Pane>

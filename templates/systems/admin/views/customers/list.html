<PagedList id="adminCustomerList" class="flex-fill" height="100%" $.state.view="adminCustomerView()" searchable sortable selectable $.source="admin_state.customerSource" $.state.sortoptions="[{value:'name',label:'{#名称升序#}'},{value:'-name',label:'{#名称降序#}'}]" $.state.columns="[{name:'name',label:'{#客户#}',class:'col-6'},{name:'status',label:'{#状态#}',class:'col-3'},{name:'city',label:'{#城市#}',class:'col-3'}]">
 <template slot="item"><div class="row g-2 align-items-center"><div $class="adminCustomerView()==='cards'?'col-12':'col-6'"><button type="button" class="btn btn-link p-0 text-start text-break text-primary-emphasis" $class="adminPage()==='customer-workspace'&&Hash.adminWorkspaceCustomer===item.id?'fw-semibold':''" $aria-current="adminPage()==='customer-workspace'&&Hash.adminWorkspaceCustomer===item.id?'true':null" $text="item.name" $onclick="adminOpenCustomer(item.id)"></button><span class="d-block small text-body-secondary" $text="item.id+' · '+item.contact"></span></div><div $class="adminCustomerView()==='cards'?'col-6':'col-3'"><span class="badge" $class="item.status==='合作中'?'bg-success-subtle text-success-emphasis':'bg-warning-subtle text-warning-emphasis'" $text="item.status"></span></div><div class="text-body-secondary small" $class="adminCustomerView()==='cards'?'col-6':'col-3'" $text="item.city"></div></div></template>
 <div slot="settings" class="mt-2"><label class="form-label small" for="adminCustomerViewChoice">{#客户展示方式#}</label><select id="adminCustomerViewChoice" class="form-select" $.value="adminCustomerView()" $onchange="Hash.go({adminCustomerView:event.target.value})"><option value="list">{#列表#}</option><option value="cards">{#卡片#}</option></select></div>
 <template slot="selection-actions"><button type="button" class="btn btn-outline-secondary" $disabled="!adminCustomerList.state.selection.length||admin_state.saving" $onclick="adminBulkCustomersWithResult(adminCustomerList.state.selection)">{#完成跟进#}</button></template>
</PagedList>

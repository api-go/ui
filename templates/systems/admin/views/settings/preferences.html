<div class="flex-fill overflow-auto p-3 p-md-4"><div data-changebind-scope .changebind="AdminPreferences"><AutoForm id="adminPreferencesForm" columns="2" nobutton $.state.data="admin_state.preferencesDraft" $.state.schema="adminPreferenceFields" $onsubmit="adminSavePreferences(event)"></AutoForm></div><div class="d-flex flex-wrap gap-2 border-top pt-3 mt-4"><button type="button" class="btn btn-primary" $disabled="admin_state.saving||!State.changes.AdminPreferences" $onclick="adminPreferencesForm.submit()">{#保存偏好#}</button><button type="button" class="btn btn-outline-secondary" $disabled="admin_state.saving" $onclick="adminResetDraft('preferences')">{#撤销修改#}</button></div><p class="small text-body-secondary mt-3">{#每页数量应用到客户列表。通知开关仅保存示例偏好，不申请浏览器通知权限或发送消息。#}</p></div>

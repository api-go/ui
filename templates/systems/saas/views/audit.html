<Pane scroll="auto">
<PageHeader slot="header" heading="{#操作记录#}" $.state.description="''">
<template slot="actions">
<button type="button" class="btn btn-outline-secondary" $onclick="templateDownload('audit.json',saas_state.data.audit)" >{#下载记录#}</button>
</template>
</PageHeader>
<div slot="content" class="p-3 p-md-4">
<div class="table-responsive">
<table class="table align-middle text-nowrap">
<thead>
<tr>
<th scope="col">{#操作#}</th>
<th scope="col">{#操作者#}</th>
<th scope="col">{#时间#}</th>
</tr>
</thead>
<tbody>
<tr $each="saas_state.data.audit" as="row" key="id">
<td class="" $text="row.name">
</td>
<td class="" $text="row.actor">
</td>
<td class="" $text="templateDate(row.time)">
</td>
</tr>
</tbody>
</table>
</div>
<p class="text-body-secondary p-3" $if="!saas_state.data.audit.length">{#修改组织、成员或角色后会生成本机记录。#}</p>
</div>
</Pane>

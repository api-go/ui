<Pane scroll="auto">
<PageHeader slot="header" heading="{#服务工作台#}" $.state.description="''">
<template slot="actions">
<button type="button" class="btn btn-primary" $onclick="serviceGo('editor')" >
<i class="bi bi-plus-lg me-1" aria-hidden="true">
</i>{#创建工单#}</button>
</template>
</PageHeader>
<div slot="content" class="p-3 p-md-4">
<div class="row g-3 mb-4">
<div class="col-6 col-xl-3">
<section class="border rounded p-3 h-100">
<div class="small text-body-secondary mb-2">{#待分配#}</div>
<div class="h3 mb-0" $text="service_state.data.tickets.filter(x=>x.status==='待分配').length">
</div>
</section>
</div>
<div class="col-6 col-xl-3">
<section class="border rounded p-3 h-100">
<div class="small text-body-secondary mb-2">{#处理中#}</div>
<div class="h3 mb-0" $text="service_state.data.tickets.filter(x=>x.status==='处理中').length">
</div>
</section>
</div>
<div class="col-6 col-xl-3">
<section class="border rounded p-3 h-100">
<div class="small text-body-secondary mb-2">{#高优先级#}</div>
<div class="h3 mb-0" $text="service_state.data.tickets.filter(x=>x.priority==='高'&&!['已解决','已关闭'].includes(x.status)).length">
</div>
</section>
</div>
<div class="col-6 col-xl-3">
<section class="border rounded p-3 h-100">
<div class="small text-body-secondary mb-2">{#已解决#}</div>
<div class="h3 mb-0" $text="service_state.data.tickets.filter(x=>['已解决','已关闭'].includes(x.status)).length">
</div>
</section>
</div>
</div>
<h2 class="h5">{#优先处理#}</h2>
<div class="table-responsive">
<table class="table align-middle text-nowrap">
<thead>
<tr>
<th scope="col">{#工单#}</th>
<th scope="col">{#客户#}</th>
<th scope="col">{#负责人#}</th>
<th scope="col">{#状态#}</th>
</tr>
</thead>
<tbody>
<tr $each="service_state.data.tickets.filter(x=>!['已解决','已关闭'].includes(x.status)).slice(0,6)" as="row" key="id">
<td>
<button class="btn btn-link p-0 text-start" $text="row.name" $onclick="serviceGo('detail',row.id)">
</button>
</td>
<td class="" $text="row.customer">
</td>
<td class="" $text="row.assignee">
</td>
<td class="" $text="row.status">
</td>
</tr>
</tbody>
</table>
</div>
</div>
</Pane>

<Pane scroll="none"><div slot="header" class="d-flex flex-wrap align-items-center justify-content-between gap-2"><div><h1 class="h4 mb-1" $text="desktopNote()?.label||(Hash.desktopNote?'{#笔记不可用#}':'{#选择笔记#}')"></h1><p class="small text-body-secondary mb-0" $text="State.changes.DesktopWorkspace?'{#工作区有未保存修改#}':'{#已就绪#}'"></p></div><div class="btn-group" role="group" aria-label="{#编辑视图#}"><button class="btn btn-outline-secondary" type="button" $each="[{id:'source',label:'{#编辑#}'},{id:'split',label:'{#分屏#}'},{id:'preview',label:'{#预览#}'}]" as="mode" $aria-pressed="desktopMode()===mode.id?'true':'false'" $onclick="Hash.go({desktopMode:mode.id})" $text="mode.label"></button></div></div>
 <div slot="content" class="d-flex flex-column flex-fill overflow-hidden" data-changebind-scope .changebind="DesktopWorkspace" $oninput="desktopChanged()"><CodeEditor id="desktopEditor" $if="desktopNote()" lang="markdown" wrap $bind="desktop_state.notes[Hash.desktopNote]" $.mode="desktopMode()" $onerror="desktop_state.error='{#编辑器加载失败，请先保存其他草稿后刷新。#}'"></CodeEditor><div class="p-3" $if="!desktopNote()"><p $text="Hash.desktopNote?'{#笔记不存在，地址可能无效。#}':'{#从资源库或顶部选择一份笔记开始。#}'"></p><button class="btn btn-primary" type="button" $onclick="Hash.go({desktopNote:'brief'})">{#打开项目简报#}</button></div></div>
 <div slot="footer" class="d-flex flex-wrap align-items-center gap-2"><span class="small text-body-secondary flex-fill">{#仅存本机；刷新前请保存。快捷键 Ctrl/⌘ S。#}</span><button class="btn btn-link text-body-secondary" type="button" $disabled="!State.changes.DesktopWorkspace" $onclick="desktopDiscard()">{#放弃修改#}</button></div>
</Pane>

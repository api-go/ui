<!doctype html>
<html lang="zh-CN">
<head>
<title>写作工作室 · UI 模板</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="../frameworks/State.js"></script><script src="../frameworks/Bootstrap.js"></script>
<script src="../utilities/Disposer.js"></script><script src="../utilities/UUID.js"></script><script src="../utilities/MouseMover.js"></script><script src="../utilities/VirtualScroll.js"></script><script src="../utilities/Editor.js"></script>
<script src="../libraries/CodeMirror.js"></script><script src="../libraries/Markdown.js"></script>
<script src="../components/base/Modal.js"></script><script src="../components/base/Dialog.js"></script><script src="../components/base/Toast.js"></script><script src="../components/base/AutoForm.js"></script><script src="../components/base/List.js"></script><script src="../components/base/Resizer.js"></script><script src="../components/base/SplitPane.js"></script><script src="../components/base/Pane.js"></script><script src="../components/base/AppShell.js"></script><script src="../components/editor/CodeEditor.js"></script>
<script>
Bootstrap.config({bindDarkMode:[LocalStorage,'templateDark']})
const studioNotes=[{id:'brief',label:'项目简报',summary:'目标与方向'},{id:'ideas',label:'灵感收集',summary:'记录每个好想法'},{id:'review',label:'每周回顾',summary:'把进展变成经验'}]
const studioDefaults={brief:'# 新项目，从清晰开始\n\n## 我们想解决什么\n\n写下问题、目标，以及最重要的下一步。\n\n## 本周计划\n\n- 明确用户需求\n- 完成第一个小版本\n- 收集真实反馈',ideas:'# 灵感收集\n\n把零散想法放在这里，慢慢建立连接。',review:'# 每周回顾\n\n## 做得好的事情\n\n## 学到的新经验\n\n## 下一步'}
const studio_state=NewState({drafts:NewState({...studioDefaults,...LocalStorage.studioNotes}),error:'',notice:''})
State.changes.StudioNotes=false
if(!Hash.studioNote||!Hash.studioMode)Hash.go({studioNote:Hash.studioNote||'brief',studioMode:Hash.studioMode||'source'})
function studioSelection(){return studioNotes.find(note=>note.id===Hash.studioNote)}
function saveStudio(){
 studio_state.error='';studio_state.notice=''
 try{LocalStorage.studioNotes={...studio_state.drafts};State.changes.StudioNotes=false;studio_state.notice='全部笔记已保存到当前浏览器。'}
 catch(error){studio_state.error='保存失败，所有草稿已保留，请重试。'}
}
</script>
</head>
<body class="m-0">
<AppShell viewport>
 <div slot="header" class="d-flex flex-wrap align-items-center gap-2 flex-fill"><i class="bi bi-feather text-primary" aria-hidden="true"></i><span class="fw-semibold">写作工作室</span><span class="badge text-bg-secondary">Markdown</span><a class="btn  btn-link ms-auto" href="index.html">模板目录</a><button class="btn  btn-outline-secondary" aria-label="切换主题" $onclick="LocalStorage.templateDark=!LocalStorage.templateDark"><i class="bi bi-circle-half" aria-hidden="true"></i></button><button class="btn  btn-primary" $disabled="!State.changes.StudioNotes" $onclick="saveStudio()">保存全部笔记</button></div>
 <SplitPane slot="content" $bind="LocalStorage.studioSidebarWidth" $.state.pane="Hash.studioNote?'main':'sidebar'">
  <Pane slot="sidebar" scroll="none">
   <div slot="header"><h2 class="h5 mb-1">我的笔记</h2><p class="small text-body-secondary mb-0">切换笔记时保留所有草稿</p></div>
   <List slot="content" auto-select $.state.list="studioNotes" $bind="Hash.studioNote"></List>
   <span slot="footer" class="small text-body-secondary">一个工作空间，一次统一保存。</span>
  </Pane>
  <Pane slot="main" scroll="none">
   <div slot="header" class="d-flex flex-wrap justify-content-between align-items-center gap-2"><div><h1 class="h4 mb-1" $text="studioSelection()?.label||'笔记不可用'"></h1><p class="small text-body-secondary mb-0" $text="State.changes.StudioNotes?'有未保存的修改':'草稿已就绪'"></p></div><div class="btn-group" role="group" aria-label="编辑视图"><button class="btn  btn-outline-secondary" $aria-pressed="Hash.studioMode==='source'?'true':'false'" $onclick="Hash.go({studioMode:'source'})">编辑</button><button class="btn  btn-outline-secondary" $aria-pressed="Hash.studioMode==='split'?'true':'false'" $onclick="Hash.go({studioMode:'split'})">分屏</button><button class="btn  btn-outline-secondary" $aria-pressed="Hash.studioMode==='preview'?'true':'false'" $onclick="Hash.go({studioMode:'preview'})">预览</button></div></div>
   <template slot="content">
    <p class="alert alert-danger m-3" role="alert" $if="studio_state.error" $text="studio_state.error"></p>
    <p class="alert alert-success m-3" role="status" $if="studio_state.notice" $text="studio_state.notice"></p>
    <div $if="!studioSelection()" class="p-4" role="alert">笔记不存在。<button class="btn btn-link" $onclick="Hash.go({studioNote:'brief'})">返回项目简报</button></div>
    <div class="d-flex flex-column flex-fill overflow-hidden" data-changebind-scope .changebind="StudioNotes" $oninput="studio_state.notice='';studio_state.error=''">
     <CodeEditor $if="studioSelection()" lang="markdown" wrap $bind="studio_state.drafts[Hash.studioNote]" $.mode="['source','split','preview'].includes(Hash.studioMode)?Hash.studioMode:'source'"></CodeEditor>
    </div>
   </template>
   <span slot="footer" class="small text-body-secondary">笔记保存在当前浏览器。刷新前请保存。</span>
  </Pane>
 </SplitPane>
</AppShell>
</body></html>

<Pane scroll="auto">
<PageHeader slot="header" heading="{#文件详情#}" $.state.description="''">
<template slot="actions">
<button type="button" class="btn btn-outline-primary" $onclick="patternsDownload()" $if="patternsFile()">
<i class="bi bi-download me-1" aria-hidden="true">
</i>{#下载文件#}</button>
</template>
</PageHeader>
<div slot="content" class="p-3 p-md-4">
<template $if="patternsFile()">
<h2 class="h3" $text="patternsFile()?.name">
</h2>
<p class="text-body-secondary" $text="patternsFile()?.folder+' · '+Math.ceil((patternsFile()?.size||0)/1024)+' KB'">
</p>
<pre class="text-wrap text-break bg-body-tertiary border rounded p-3 lh-lg" $text="patternsFile()?.text">
</pre>
</template>
<div class="alert alert-warning" $if="!(patternsFile())">{#记录不存在，请返回列表选择。#}</div>
</div>
</Pane>

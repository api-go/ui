<section class="container py-4 py-md-5">
<h1 class="display-6 fw-semibold mb-3">{#常见问题#}</h1>
<div class="accordion" id="websiteFAQ">
<section class="accordion-item" $each="[{id:'one',question:'{#支持手机使用吗？#}',answer:'{#支持。业务页面按可用空间适配导航、表单与内容。#}'},{id:'two',question:'{#可以接入现有业务系统吗？#}',answer:'{#可以按业务边界连接既有接口，具体接入方式需评估数据与权限要求。#}'},{id:'three',question:'{#提交演示申请会发生什么？#}',answer:'{#本模板只保存当前浏览器中的虚构申请，不会发送邮件或联系任何人。#}'},{id:'four',question:'{#团队成员如何开始使用？#}',answer:'{#在真实产品中由组织管理员邀请成员，再分配对应业务角色。#}'}]" as="item" key="id">
<h2 class="accordion-header">
<button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" $data-bs-target="'#faq-'+item.id" aria-expanded="false" $aria-controls="'faq-'+item.id" $text="item.question">
</button>
</h2>
<div class="accordion-collapse collapse" $id="'faq-'+item.id" data-bs-parent="#websiteFAQ">
<div class="accordion-body text-body-secondary" $text="item.answer">
</div>
</div>
</section>
</div>
</section>

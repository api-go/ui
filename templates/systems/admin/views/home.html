<div class="flex-fill overflow-auto p-3 p-md-4 bg-body-tertiary">
 <div class="row g-3 mb-4">
  <div class="col-6 col-xl-3"><div class="bg-body border rounded p-3 h-100"><p class="text-body-secondary small mb-2">{#客户总数#}</p><strong class="h3 d-block mb-2" $text="admin_state.data.customers.length"></strong><button type="button" class="btn btn-link p-0" $onclick="adminGo({adminPage:'customers'})">{#浏览客户#} <i class="bi bi-arrow-right" aria-hidden="true"></i></button></div></div>
  <div class="col-6 col-xl-3"><div class="bg-body border rounded p-3 h-100"><p class="text-body-secondary small mb-2">{#待跟进客户#}</p><strong class="h3 d-block mb-2" $text="admin_state.data.customers.filter(item=>item.status==='待跟进').length"></strong><button type="button" class="btn btn-link p-0" $onclick="admin_state.customerSource.setQuery({filters:{status:'待跟进'}});adminGo({adminPage:'customers'})">{#安排跟进#} <i class="bi bi-arrow-right" aria-hidden="true"></i></button></div></div>
  <div class="col-6 col-xl-3"><div class="bg-body border rounded p-3 h-100"><p class="text-body-secondary small mb-2">{#进行中订单#}</p><strong class="h3 d-block mb-2" $text="admin_state.data.orders.filter(item=>item.status==='进行中').length"></strong><button type="button" class="btn btn-link p-0" $onclick="admin_state.orderSource.setQuery({filters:{status:'进行中'}});adminGo({adminPage:'orders'})">{#查看订单#} <i class="bi bi-arrow-right" aria-hidden="true"></i></button></div></div>
  <div class="col-6 col-xl-3"><div class="bg-body border rounded p-3 h-100"><p class="text-body-secondary small mb-2">{#订单总额 · 本地示例#}</p><strong class="h4 d-block mb-2 text-break" $text="adminCompactMoney(admin_state.data.orders.filter(item=>item.status!=='已取消').reduce((sum,item)=>sum+item.amount,0))"></strong><span class="small text-body-secondary">{#不包含已取消订单#}</span></div></div>
 </div>
 <div class="row g-4">
  <section class="col-12 col-xl-7 order-2 order-xl-1"><div class="bg-body border rounded p-3 p-md-4 h-100"><div class="d-flex align-items-center justify-content-between gap-2 mb-3"><h2 class="h6 mb-0">{#最近操作#}</h2><button type="button" class="btn btn-link py-0" $onclick="adminGo({adminPage:'history'})">{#全部记录#}</button></div><ol class="list-unstyled mb-0"><li class="border-bottom py-3" $each="admin_state.data.activity.slice(0,4)" as="activity" key="id"><strong class="d-block mb-1" $text="activity.label"></strong><p class="mb-1 small text-body-secondary text-break" $text="activity.detail"></p><time class="small text-body-secondary" $text="adminDate(activity.time)"></time></li></ol></div></section>
  <section class="col-12 col-xl-5 order-1 order-xl-2"><div class="bg-body border rounded p-3 p-md-4 h-100"><h2 class="h6 mb-3">{#快捷操作#}</h2><p class="text-body-secondary">{#创建客户，或查看待跟进客户和进行中的订单。#}</p><div class="d-flex flex-wrap gap-2 mb-3"><button class="btn btn-primary" type="button" $onclick="adminGo({adminPage:'customer-edit'})">{#新建客户#}</button><button class="btn btn-outline-secondary" type="button" $onclick="adminGo({adminPage:'guide'})">{#查看源码指南#}</button></div><p class="small text-body-secondary mb-0">{#保存写入当前浏览器。可在“状态与恢复”中体验失败、重试或重置示例。#}</p></div></section>
 </div>
</div>

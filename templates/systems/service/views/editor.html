<Pane scroll="auto">
<PageHeader slot="header" heading="{#创建工单#}" $.state.description="''">
<template slot="actions">
</template>
</PageHeader>
<div slot="content" class="p-3 p-md-4">
<form $onsubmit="serviceSave(event)" $oninput="State.changes.Service=true" $onchange="State.changes.Service=true">
<div class="row g-3">
<div class="col-12 col-md-6">
<label class="d-block">
<span class="form-label">{#工单标题#}</span>
<input class="form-control" type="text" $bind="service_state.draft.name" required maxlength="100">
</label>
</div>
<div class="col-12 col-md-6">
<label class="d-block">
<span class="form-label">{#客户#}</span>
<input class="form-control" type="text" $bind="service_state.draft.customer" required>
</label>
</div>
<div class="col-12 col-md-6">
<label class="d-block">
<span class="form-label">{#分类#}</span>
<select aria-label="{#分类#}" class="form-select" $bind="service_state.draft.category" >
<option value="设备">{#设备#}</option>
<option value="账号">{#账号#}</option>
<option value="其他">{#其他#}</option>
</select>
</label>
</div>
<div class="col-12 col-md-6">
<label class="d-block">
<span class="form-label">{#优先级#}</span>
<select aria-label="{#优先级#}" class="form-select" $bind="service_state.draft.priority" >
<option value="高">{#高#}</option>
<option value="普通">{#普通#}</option>
<option value="低">{#低#}</option>
</select>
</label>
</div>
</div>
<label class="d-block mt-3">
<span class="form-label">{#问题描述#}</span>
<textarea class="form-control" rows="5" required $bind="service_state.draft.description">
</textarea>
</label>
<div class="d-flex flex-wrap gap-2 border-top pt-3 mt-4">
<button type="submit" class="btn btn-primary">{#保存#}</button>
<button type="button" class="btn btn-outline-secondary" $onclick="serviceGo('tickets')" >{#取消#}</button>
</div>
</form>
</div>
</Pane>

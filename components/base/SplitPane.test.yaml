testData: { width: 260 }
cases:
  - name: desktop resize writes binding and preserves bounded regions
    attributes: { id: subject, min: 180, max: 500, main-min: 250, "$bind": testData.width, "$.state.width": testData.width, "$.state.pane": "'sidebar'", style: "width:1000px;height:320px;flex:none" }
    slots:
      sidebar: '<div class="overflow-auto"><div style="height:1500px">Sidebar</div></div>'
      main: '<div class="overflow-auto"><div style="height:1500px">Main</div></div>'
    before:
      - property: { path: subject.state.width, equals: 260 }
      - property: { path: subject.state.pane, equals: sidebar }
      - property: { path: subject.state.narrow, equals: false }
      - script: "return subject.querySelector('Resizer').getAttribute('aria-valuenow')==='260'"
      - script: "return subject.querySelector('[data-split-sidebar]').offsetWidth===260 && subject.scrollHeight===subject.clientHeight"
    actions:
      - script: "const handle=subject.querySelector('Resizer'); handle.focus(); handle.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true,cancelable:true}))"
    after:
      - data: { path: testData.width, equals: 270 }
      - event: { name: change, count: 1, last: 270 }
      - script: "return subject.querySelector('[data-split-sidebar]').offsetWidth===270 && subject.querySelector('[data-split-main]').clientWidth>=250"
  - name: narrow drawer retains main and restores input and focus
    attributes: { id: subject, style: "width:390px;height:300px;flex:none" }
    slots:
      sidebar: '<input aria-label="Retained" value="Retained input">'
      main: '<div>Detail content</div>'
    before:
      - property: { path: subject.state.narrow, equals: true }
      - script: "return subject.querySelector('Resizer').hidden && subject.querySelector('[data-split-main]').clientWidth===390"
    actions:
      - click: '#subject [data-split-toggle]'
      - wait: 400
      - script: "const input=subject.querySelector('input');input.value='Edited';return subject.querySelector('[data-split-sidebar]').classList.contains('show')"
      - click: '#subject [aria-label="Close list"]'
      - wait: 400
    after:
      - property: { path: subject.state.pane, equals: main }
      - event: { name: panechange, count: 2, last: main }
      - script: "return subject.querySelector('input').value==='Edited' && !subject.querySelector('[data-split-sidebar]').classList.contains('show') && document.activeElement===subject.querySelector('[data-split-toggle]')"
  - name: host toggle disabled sidebar and fixed rail preserve preference
    attributes: { id: subject, notoggle: true, breakpoint: 500, "$.state.sidebarenabled": 'true', "$.state.width": '220', "$.state.resizable": 'false', style: "width:650px;height:240px;flex:none" }
    before:
      - property: { path: subject.state.narrow, equals: false }
      - script: "return subject.querySelector('Resizer').hidden"
    actions:
      - script: "subject.state.sidebarenabled=false;await new Promise(resolve=>setTimeout(resolve,30));return subject.querySelector('[data-split-sidebar]').hidden"
      - script: "subject.state.sidebarenabled=true;subject.style.width='390px';await new Promise(resolve=>setTimeout(resolve,50));return subject.querySelector('[data-split-toggle]').parentElement.hidden"
      - call: { method: toggle }
      - wait: 400
    after:
      - property: { path: subject.state.pane, equals: sidebar }
      - property: { path: subject.state.width, equals: 220 }
      - script: "const opened=subject.querySelector('[data-split-sidebar]').classList.contains('show');subject.show('main');await new Promise(resolve=>setTimeout(resolve,400));return opened"
  - name: container shrink preserves width preference and invalid switches are rejected
    attributes: { id: subject, "$.state.width": '450', "$.state.pane": "'sidebar'", style: "width:1000px;height:240px;flex:none" }
    before:
      - script: "const sidebar=subject.querySelector('[data-split-sidebar]');const deadline=performance.now()+1500;while(sidebar.offsetWidth!==450&&performance.now()<deadline)await new Promise(requestAnimationFrame);return sidebar.offsetWidth===450"
    actions:
      - script: "subject.style.width='390px'; await new Promise(resolve=>setTimeout(resolve,70))"
      - call: { method: show, args: [main] }
      - script: "try { subject.show('invalid'); throw new Error('accepted invalid pane') } catch(error) { if(!error.message.includes('expected')) throw error }"
      - script: "subject.style.width='1000px'; await new Promise(resolve=>setTimeout(resolve,70))"
    after:
      - property: { path: subject.state.width, equals: 450 }
      - property: { path: subject.state.narrow, equals: false }
      - event: { name: panechange, count: 1, last: main }
      - event: { name: change, count: 0 }
      - script: "const sidebar=subject.querySelector('[data-split-sidebar]');const deadline=performance.now()+1500;while(sidebar.offsetWidth!==450&&performance.now()<deadline)await new Promise(requestAnimationFrame);return sidebar.offsetWidth===450"

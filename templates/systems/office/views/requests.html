<Pane scroll="none">
<PageHeader slot="header" heading="{#申请记录#}" $.state.description="''">
<template slot="actions">
<button type="button" class="btn btn-primary" $onclick="officeGo('editor')" >
<i class="bi bi-plus-lg me-1" aria-hidden="true">
</i>{#发起申请#}</button>
</template>
</PageHeader>
<div slot="content" class="d-flex flex-column overflow-hidden">
<PagedList id="office_stateList" searchable sortable  height="100%" $.source="office_state.source" $.state.columns="[{name:'name',label:'{#申请#}',class:'col-7'},{name:'status',label:'{#状态#}',class:'col-5'}]" $.state.sortoptions="[{value:'name',label:'{#名称#}'},{value:'-name',label:'{#名称倒序#}'}]">
<template slot="item">
<div class="row g-2">
<div class="col-7">
<button type="button" class="btn btn-link p-0 text-start" $text="item.name" $onclick="officeGo('detail',item.id)">
</button>
<span class="d-block small text-body-secondary" $text="item.applicant+' · '+item.type">
</span>
</div>
<div class="col-5">
<span class="badge bg-secondary-subtle text-secondary-emphasis" $text="item.status">
</span>
</div>
</div>
</template>
</PagedList>
</div>
</Pane>

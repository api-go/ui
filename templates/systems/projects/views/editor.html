<Pane scroll="auto">
<PageHeader slot="header" heading="{#编辑任务#}" $.state.description="''">
<template slot="actions">
</template>
</PageHeader>
<div slot="content" class="p-3 p-md-4">
<form data-changebind-scope .changebind="Projects" $onsubmit="projectsSaveTask(event)">
<div class="row g-3">
<div class="col-12 col-md-6">
<label class="d-block">
<span class="form-label">{#任务标题#}</span>
<input class="form-control" type="text" $bind="projects_state.draft.title" required>
</label>
</div>
<div class="col-12 col-md-6">
<label class="d-block">
<span class="form-label">{#负责人#}</span>
<select aria-label="{#负责人#}" class="form-select" $bind="projects_state.draft.owner" >
<option value="林悦">{#林悦#}</option>
<option value="周宁">{#周宁#}</option>
<option value="许安">{#许安#}</option>
<option value="陈晨">{#陈晨#}</option>
</select>
</label>
</div>
<div class="col-12 col-md-6">
<label class="d-block">
<span class="form-label">{#截止日期#}</span>
<input class="form-control" type="date" $bind="projects_state.draft.due" required>
</label>
</div>
<div class="col-12 col-md-6">
<label class="d-block">
<span class="form-label">{#优先级#}</span>
<select aria-label="{#优先级#}" class="form-select" $bind="projects_state.draft.priority" >
<option value="高">{#高#}</option>
<option value="普通">{#普通#}</option>
<option value="低">{#低#}</option>
</select>
</label>
</div>
<div class="col-12 col-md-6">
<label class="d-block">
<span class="form-label">{#阶段#}</span>
<select aria-label="{#阶段#}" class="form-select" $bind="projects_state.draft.columnId">
<option $each="projects_state.data.board.columns" as="column" key="id" $value="column.id" $text="column.title">
</option>
</select>
</label>
</div>
</div>
<div class="mt-3">
<label class="form-label">{#协作成员#}</label>
<RemoteSelect multiple label="{#协作成员#}" placeholder="{#搜索团队成员#}" $.load="projectsMemberLookup" $bind="projects_state.draft.collaborators"></RemoteSelect>
<p class="small text-body-secondary mt-2 mb-0">{#可选择多位成员；与任务一起保存。#}</p>
</div>
<label class="d-block mt-3">
<span class="form-label">{#任务说明#}</span>
<textarea class="form-control" rows="5" $bind="projects_state.draft.content">
</textarea>
</label>
<div class="d-flex flex-wrap gap-2 border-top pt-3 mt-4">
<button type="submit" class="btn btn-primary">{#保存#}</button>
<button type="button" class="btn btn-outline-secondary" $onclick="projectsGo('tasks')" >{#取消#}</button>
</div>
</form>
</div>
</Pane>

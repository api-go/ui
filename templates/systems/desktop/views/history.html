<Pane><PageHeader slot="header" heading="{#保存历史#}" description="{#保留最近10次本机快照；载入后仍需明确保存。#}"><template slot="actions"><button class="btn btn-outline-primary" type="button" $if="desktop_state.revisions.some(revision=>revision.id===Hash.desktopRevision)" $onclick="desktopRestore()">{#载入为草稿#}</button></template></PageHeader><div slot="content" class="p-3"><p class="text-body-secondary" $if="!desktop_state.revisions.length">{#尚未保存过工作区。编辑笔记后保存即可生成快照。#}</p><div class="list-group"><button class="list-group-item list-group-item-action py-3" type="button" $each="desktop_state.revisions" as="revision" key="id" $aria-current="Hash.desktopRevision===revision.id?'true':null" $onclick="Hash.go({desktopRevision:revision.id})"><strong $text="new Date(revision.time).toLocaleString()"></strong><span class="d-block small text-body-secondary" $text="revision.tasks.length+' {#项待办#}'"></span></button></div><div class="mt-3" $if="Hash.desktopRevision"><p class="text-body-secondary" $if="!desktop_state.revisions.some(revision=>revision.id===Hash.desktopRevision)">{#该快照在当前浏览器不可用，请选择其他记录。#}</p></div></div></Pane>

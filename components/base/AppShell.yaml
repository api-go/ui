name: AppShell
kind: component
src: /ui/components/base/AppShell.js
dependencies: [Disposer]
purpose: Bounded application shell with persistent navigation, top bar and a filling main region.
attributes:
  viewport: 'Opt in to 100dvh at the document root. Omit inside another bounded host.'
state:
  navOpen: 'Boolean, default false. Controls navigation visibility below 768px of actual shell width; wide navigation stays visible.'
methods:
  toggleNavigation: 'Toggle state.navOpen; navigation content remains mounted.'
slots:
  header: 'Top bar brand, global tools or identity.'
  navigation: 'Application navigation. Prefer Nav bound to a namespaced Hash field.'
  content: 'Main workspace; a sole element fills the available region.'
rules:
  - Set --ui-navigation-width to customize the default 14rem navigation width.
  - Narrow navigation overlays content within the shell; its toggle remains available when navigation is supplied. Escape closes navigation and returns focus to its toggle. Host may set state.navOpen=false after confirmed navigation.
  - Owns no route, dirty guard, authorization or resource data. Bind Nav and resource components explicitly.
  - viewport belongs only on the outer application shell, never on nested views.
examples:
  shell: |
    <AppShell viewport>
      <span slot="header">Operations</span>
      <Nav slot="navigation" vertical $.state.list="modules" $bind="Hash.opsModule"></Nav>
      <Pane slot="content"><div slot="content" class="p-3">Workspace</div></Pane>
    </AppShell>
tests: [AppShell.test.yaml]

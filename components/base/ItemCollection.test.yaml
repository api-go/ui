testData:
  render: { objects: [{ name: Alpha }], numbers: [1] }
  addString: { items: [one, two], added: three }
  addObject: { items: [{ name: Alpha }], added: Beta }
  addNumber: { items: [1], added: 7 }
  addBoolean: { items: [true], added: true }
  remove: { items: [one, two, three] }
  reorder: { items: [one, two] }
  cancelAdd: { items: [one, two], added: blocked }
  cancelSubmit: { items: [one, two], added: cancelled }
  missing: { items: [] }
  visible: { items: [] }
  density: {items: []}
  reactive: {items: []}
  privateEvents: {items: []}

cases:
  - name: repeat rows validate locate stable errors and reject stale results
    covers: [attributes.idfield, properties.validator, methods.validate, methods.setErrors, methods.focusField]
    attributes: {id: subject, layout: vertical, idfield: key}
    slots:
      item: '<template><input class="form-control" name="qty" type="number" min="1" required $bind="item.qty"></template>'
    actions:
      - script: |
          subject.value=[NewState({key:'a',qty:2}),NewState({key:'b',qty:3})];
          await new Promise(r=>setTimeout(r,30));
          subject.validator=async()=>({b:{qty:'Too many'}});
          if(await subject.validate())throw Error('Invalid rows accepted');
          if(document.activeElement!==subject.querySelectorAll('[name=qty]')[1])throw Error('Row error not focused');
          subject.reorder(1,0);await new Promise(r=>setTimeout(r,30));
          if(subject.state.errors.b.qty!=='Too many'||!subject.focusField('b','qty'))throw Error('Stable errors lost');
          let resolve;subject.validator=()=>new Promise(r=>resolve=r);
          const checking=subject.validate();subject.remove(0);resolve({a:{qty:'Late'}});
          if(await checking||Object.keys(subject.state.errors).length)throw Error('Late validation published');
          subject.setErrors({a:{qty:'Check'}});
      - fill: {selector: '[name=qty]', value: '4'}
    after:
      - script: "return !subject.state.errors.a && subject.value[0].qty==4"
  - name: native and Sortable changes are not public array changes
    attributes: {id: subject, type: string, "$bind": testData.privateEvents.items}
    slots:
      creator: '<input class="private-creator" $bind="this.newItem">'
    before: []
    actions:
      - fill: {selector: .private-creator, value: Retained}
      - script: "subject.querySelector('.private-creator').dispatchEvent(new Event('change',{bubbles:true})); subject.querySelector('.item-collection-items').dispatchEvent(new CustomEvent('change',{bubbles:true,detail:null}))"
    after:
      - property: {path: subject.newItem, equals: Retained}
      - data: {path: testData.privateEvents.items, equals: []}
      - event: {name: change, count: 0}
  - name: newly added object fields update derived bindings before saving
    attributes: {id: subject, "$bind": testData.reactive.items}
    slots:
      item: '<template><input class="row-quantity" type="number" $bind="item.qty"><span class="row-total" $text="Number(item.qty)*Number(item.price)"></span></template>'
      creator: '<template><input class="new-quantity" type="number" $bind="this.newItem.qty"><input class="new-price" type="number" $bind="this.newItem.price"></template>'
    before: []
    actions:
      - fill: {selector: .new-quantity, value: "2"}
      - fill: {selector: .new-price, value: "35"}
      - click: {selector: .item-collection-add}
      - wait: 50
      - fill: {selector: .row-quantity, value: "4"}
      - wait: 50
    after:
      - dom: {selector: .row-total, text: "140"}
      - script: "return Number(testData.reactive.items[0].qty)===4"
      - event: {name: change, count: 1}
  - name: renders object binding and horizontal layout
    attributes: { id: subject, type: object, layout: horizontal, "$bind": testData.render.objects }
    slots:
      item: '<template><span class="object-value" $text="item.name"></span></template>'
      creator: '<input class="creator" $bind="this.newItem.name">'
    before:
      - property: { path: subject.value, equals: testData.render.objects }
      - dom: { selector: .object-value, text: Alpha }
      - property: { path: subject.layout, equals: horizontal }
    actions: []
    after: []

  - name: vertical number rendering
    attributes: { id: subject, type: number, layout: vertical, "$bind": testData.render.numbers }
    slots:
      item: '<template><span class="number-value" $text="item"></span></template>'
      creator: '<input class="creator" type="number" $bind="this.newItem">'
    before:
      - dom: { selector: .number-value, text: "1" }
      - property: { path: subject.layout, equals: vertical }
    actions: []
    after: []

  - name: string input and output
    attributes: { id: subject, type: string, "$bind": testData.addString.items }
    slots:
      item: '<template><span class="item-value" $text="item"></span></template>'
      creator: '<input class="creator" $bind="this.newItem">'
    before: [{ dom: { selector: .item-value, texts: [one, two] } }]
    actions:
      - fill: { selector: .creator, value: testData.addString.added }
      - click: { selector: '[aria-label="Add"]' }
      - wait: 50
    after:
      - data: { path: testData.addString.items, equals: [one, two, three] }
      - property: { path: subject.newItem, equals: "" }
      - dom: { selector: .creator, value: "" }
      - event: { name: change, count: 1, last: [one, two, three] }

  - name: object input and output
    attributes: { id: subject, "$bind": testData.addObject.items }
    slots:
      item: '<template><span class="item-value" $text="item.name"></span></template>'
      creator: '<input class="creator" $bind="this.newItem.name">'
    before: []
    actions:
      - fill: { selector: .creator, value: testData.addObject.added }
      - click: { selector: '[aria-label="Add"]' }
      - wait: 50
    after:
      - data: { path: testData.addObject.items, equals: [{ name: Alpha }, { name: Beta }] }
      - dom: { selector: .item-value, texts: [Alpha, Beta] }
      - dom: { selector: .creator, value: "" }

  - name: number input and output
    attributes: { id: subject, type: number, "$bind": testData.addNumber.items }
    slots:
      item: '<template><span $text="item"></span></template>'
      creator: '<input class="creator" type="number" $bind="this.newItem">'
    before: []
    actions:
      - fill: { selector: .creator, value: testData.addNumber.added }
      - click: { selector: '[aria-label="Add"]' }
      - wait: 50
    after:
      - data: { path: testData.addNumber.items, equals: [1, 7] }
      - dom: { selector: .creator, value: "" }

  - name: boolean input and output
    attributes: { id: subject, type: boolean, "$bind": testData.addBoolean.items }
    slots:
      item: '<template><span class="boolean-value" $text="item"></span></template>'
      creator: '<input class="creator" type="checkbox" $bind="this.newItem">'
    before: [{ dom: { selector: .boolean-value, text: "true" } }]
    actions:
      - check: { selector: .creator, checked: true }
      - click: { selector: '[aria-label="Add"]' }
      - wait: 50
    after:
      - data: { path: testData.addBoolean.items, equals: [true, true] }
      - script: "return subject.querySelector('.creator').checked===false"

  - name: remove writes through binding
    covers: [methods.remove]
    attributes: { id: subject, type: string, "$bind": testData.remove.items }
    slots: { item: '<template><span $text="item"></span></template>' }
    before: []
    actions: [{ click: { selector: .item-collection-remove } }]
    after:
      - data: { path: testData.remove.items, equals: [two, three] }
      - event: { name: change, count: 1, last: [two, three] }

  - name: reorder and invalid reorder
    attributes: { id: subject, type: string, "$bind": testData.reorder.items }
    slots: { item: '<template><span $text="item"></span></template>' }
    before: []
    actions:
      - call: { method: reorder, args: [1, 0], saveAs: reordered }
      - call: { method: reorder, args: [-1, 0], saveAs: invalidReorder }
    after:
      - data: { path: testData.reorder.items, equals: [two, one] }
      - property: { path: reordered, equals: true }
      - property: { path: invalidReorder, equals: false }

  - name: beforeadd cancellation
    covers: [events.beforeadd, methods.submitCreator]
    attributes: { id: subject, type: string, "$bind": testData.cancelAdd.items }
    slots: { creator: '<input class="creator" $bind="this.newItem">' }
    before: []
    actions:
      - prevent: beforeadd
      - fill: { selector: .creator, value: testData.cancelAdd.added }
      - click: { selector: '[aria-label="Add"]' }
    after:
      - data: { path: testData.cancelAdd.items, equals: [one, two] }
      - event: { name: beforeadd, count: 1 }
      - script: "return subject.newItem==='blocked' && subject.querySelector('.creator').value==='blocked'"

  - name: creatorsubmit cancellation
    covers: [events.creatorsubmit, methods.submitCreator]
    attributes: { id: subject, type: string, "$bind": testData.cancelSubmit.items }
    slots: { creator: '<input class="creator" $bind="this.newItem">' }
    before: []
    actions:
      - prevent: creatorsubmit
      - fill: { selector: .creator, value: testData.cancelSubmit.added }
      - click: { selector: '[aria-label="Add"]' }
    after:
      - data: { path: testData.cancelSubmit.items, equals: [one, two] }
      - event: { name: creatorsubmit, count: 1 }
      - script: "return subject.newItem==='cancelled' && subject.querySelector('.creator').value==='cancelled'"

  - name: missing slots and non-array normalization
    attributes: { id: subject, type: string, "$bind": testData.missing.items }
    slots: {}
    before: []
    actions:
      - script: subject.value = null
      - call: { method: add, args: [] }
    after: [{ script: "return Array.isArray(subject.value) && subject.value.length === 1" }]

  - name: visible creator value and button safety
    attributes: { id: subject, type: string, "$bind": testData.visible.items }
    slots:
      item: '<template><span class="item-value" $text="item"></span></template>'
      creator: '<input class="creator" $bind="this.newItem">'
    before: [{ script: "return [...subject.querySelectorAll('button')].every(button => button.type === 'button')" }]
    actions:
      - script: subject.querySelector('.creator').value = 'shown-default'
      - click: { selector: '[aria-label="Add"]' }
    after:
      - data: { path: testData.visible.items, equals: [shown-default] }
      - dom: { selector: .item-value, text: shown-default }

  - name: large to small creator and add glyph retain alignment focus and draft
    attributes: {id: subject, type: object, "$bind": testData.density.items, style: 'width:min(100%,32rem)'}
    slots:
      item: '<template><span class="item-value" $text="item.name"></span></template>'
      creator: '<template><input aria-label="New item" class="creator form-control" $bind="this.newItem.name"><select class="form-select" $bind="this.newItem.kind"><option value="one">One</option><option value="two">Two</option></select></template>'
    actions:
      - fill: {selector: '#subject .creator', value: Retained}
      - script: |
          const root=document.documentElement,original=root.className,input=subject.querySelector('.creator');input.focus();
          const widths=[];
          for(const mode of ['lg','sm']){
            root.classList.remove('ui-default','ui-sm','ui-lg');root.classList.add('ui-'+mode);
            await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
            const button=subject.querySelector('.item-collection-add').getBoundingClientRect(),icon=subject.querySelector('.item-collection-add i').getBoundingClientRect(),creator=subject.querySelector('.item-collection-creator').getBoundingClientRect();
            if(Math.abs(button.x+button.width/2-icon.x-icon.width/2)>1 || Math.abs(button.y+button.height/2-icon.y-icon.height/2)>1 || Math.abs(button.y+button.height/2-creator.y-creator.height/2)>1)throw new Error('Collection add alignment drifted');
            if(Math.abs(button.height-input.getBoundingClientRect().height)>1)throw new Error('Icon button lost the inherited control line height');
            if(subject.querySelector('.creator')!==input || document.activeElement!==input || input.value!=='Retained')throw new Error('Density remounted or lost the focused draft');
            widths.push(button.width);
          }
          root.className=original;
          if(widths[0]<=widths[1])throw new Error('Add button did not inherit density');
      - click: {selector: '#subject .item-collection-add'}
    after:
      - script: "return testData.density.items.length===1 && testData.density.items[0].name==='Retained'"
      - event: {name: change, count: 1}

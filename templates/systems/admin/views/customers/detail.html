<div class="flex-fill overflow-auto p-3 p-md-4">
 <template $if="adminCustomer()">
  <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4"><div><h2 class="h4 text-break" $text="adminCustomer()?.name"></h2><p class="text-body-secondary mb-0" $text="adminCustomerKey()"></p></div><button type="button" class="btn btn-outline-primary" $aria-pressed="adminCustomer()?.favorite?'true':'false'" $disabled="admin_state.saving" $onclick="adminFavorite()"><i class="bi me-1" $class="adminCustomer()?.favorite?'bi-star-fill':'bi-star'" aria-hidden="true"></i><span $text="adminCustomer()?.favorite?'{#已关注#}':'{#关注客户#}'"></span></button></div>
  <section class="mb-4"><h3 class="h6 mb-3">{#联系信息#}</h3><dl class="row g-3 mb-0"><div class="col-12 col-md-6 col-xl-4"><dt class="small fw-normal text-body-secondary mb-1">{#联系人#}</dt><dd class="mb-0" $text="adminCustomer()?.contact"></dd></div><div class="col-12 col-md-6 col-xl-4"><dt class="small fw-normal text-body-secondary mb-1">{#邮箱#}</dt><dd class="mb-0 text-break"><a $href="'mailto:'+(adminCustomer()?.email||'')" $text="adminCustomer()?.email"></a></dd></div><div class="col-12 col-md-6 col-xl-4"><dt class="small fw-normal text-body-secondary mb-1">{#电话#}</dt><dd class="mb-0" $text="adminCustomer()?.phone||'{#未提供#}'"></dd></div><div class="col-12 col-md-6"><dt class="small fw-normal text-body-secondary mb-1">{#城市#}</dt><dd class="mb-0" $text="adminCustomer()?.city"></dd></div><div class="col-12 col-md-6"><dt class="small fw-normal text-body-secondary mb-1">{#合作状态#}</dt><dd class="mb-0" $text="adminCustomer()?.status"></dd></div><div class="col-12"><dt class="small fw-normal text-body-secondary mb-1">{#备注#}</dt><dd class="mb-0 text-break" $text="adminCustomer()?.notes||'{#未提供#}'"></dd></div></dl></section>
  <section class="border-top pt-4"><h3 class="h6 mb-3">{#关联订单#}</h3><ul class="list-group list-group-flush"><li class="list-group-item px-0 d-flex flex-wrap justify-content-between gap-2" $each="admin_state.data.orders.filter(item=>item.customerId===adminCustomerKey())" as="order" key="id"><button type="button" class="btn btn-link p-0 text-start" $onclick="adminGo({adminPage:'order-detail',adminId:order.id})" $text="order.id+' · '+order.title"></button><span $text="adminMoney(order.amount)+' · '+order.status"></span></li></ul><p class="text-body-secondary" $if="!admin_state.data.orders.some(item=>item.customerId===adminCustomerKey())">{#该客户暂无订单。#}</p></section>
 </template>
 <div class="alert alert-warning" $if="!adminCustomer()"><h2 class="h6">{#客户不存在#}</h2><p>{#记录可能已重置，或地址中的客户编号无效。#}</p><button class="btn btn-outline-secondary" type="button" $onclick="adminGo({adminPage:'customers'})">{#返回客户列表#}</button></div>
</div>

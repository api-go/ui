<Pane scroll="auto">
<PageHeader slot="header" heading="{#销售漏斗#}" $.state.description="'{#按业务阶段查看商机，进入详情更新下一步。#}'">
<template slot="actions">
<button type="button" class="btn btn-primary" $onclick="crmGo('opportunity-edit')" >
<i class="bi bi-plus-lg me-1" aria-hidden="true">
</i>{#新增商机#}</button>
</template>
</PageHeader>
<div slot="content" class="p-3 p-md-4">
<div class="row g-3">
<section class="col-12 col-md-6 col-xl-3" $each="[{'value': '需求确认', 'label': '{#需求确认#}'}, {'value': '方案报价', 'label': '{#方案报价#}'}, {'value': '赢单', 'label': '{#赢单#}'}, {'value': '丢单', 'label': '{#丢单#}'}]" as="stage">
<div class="border rounded p-3 h-100">
<h2 class="h6 d-flex justify-content-between">
<span $text="stage.label">
</span>
<span class="badge bg-secondary-subtle text-secondary-emphasis" $text="crm_state.data.opportunities.filter(x=>x.stage===stage.value).length">
</span>
</h2>
<article class="bg-body-tertiary rounded p-3 mt-3" $each="crm_state.data.opportunities.filter(x=>x.stage===stage.value)" as="opp" key="id">
<button class="btn btn-link p-0 text-start" $text="opp.name" $onclick="crmGo('opportunity',opp.id)">
</button>
<p class="small text-body-secondary my-2" $text="crmCustomer(opp.customerId)?.name">
</p>
<strong $text="templateMoney(opp.amount)">
</strong>
<p class="small text-body-secondary mt-2 mb-0" $text="opp.date">
</p>
</article>
<p class="small text-body-secondary mt-3 mb-0" $if="!crm_state.data.opportunities.some(x=>x.stage===stage.value)">{#暂无商机#}</p>
</div>
</section>
</div>
</div>
</Pane>

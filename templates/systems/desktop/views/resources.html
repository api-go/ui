<Pane scroll="none"><div slot="toolbar" class="d-flex gap-2"><input type="search" class="form-control" aria-label="{#查找笔记#}" placeholder="{#查找笔记#}" $bind="Hash.desktopSearch"></div><div slot="content" class="d-flex flex-column overflow-hidden"><List class="flex-fill" auto-select $.state.list="desktopVisibleNotes()" $bind="Hash.desktopNote" $onchange="if(event.detail)Hash.go({desktopPage:'editor',desktopPane:'main'})"></List><p class="p-3 text-body-secondary" $if="!desktopVisibleNotes().length">{#没有匹配笔记，清空搜索后重试。#}</p></div></Pane>

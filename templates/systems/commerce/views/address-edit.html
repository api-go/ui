<Pane scroll="auto">
<PageHeader slot="header" heading="{#编辑地址#}" $.state.description="''">
<template slot="actions">
</template>
</PageHeader>
<div slot="content" class="p-3 p-md-4">
<form $onsubmit="commerceSaveAddress(event)" $oninput="State.changes.Commerce=true" $onchange="State.changes.Commerce=true">
<div class="row g-3">
<div class="col-12 col-md-6">
<label class="d-block">
<span class="form-label">{#收货人#}</span>
<input class="form-control" type="text" $bind="commerce_state.draft.name" required>
</label>
</div>
<div class="col-12 col-md-6">
<label class="d-block">
<span class="form-label">{#电话#}</span>
<input class="form-control" type="tel" $bind="commerce_state.draft.phone" required>
</label>
</div>
<div class="col-12 col-md-6">
<label class="d-block">
<span class="form-label">{#城市#}</span>
<input class="form-control" type="text" $bind="commerce_state.draft.city" required>
</label>
</div>
<div class="col-12 col-md-6">
<label class="d-block">
<span class="form-label">{#详细地址#}</span>
<input class="form-control" type="text" $bind="commerce_state.draft.street" required>
</label>
</div>
</div>
<div class="d-flex flex-wrap gap-2 border-top pt-3 mt-4">
<button type="submit" class="btn btn-primary">{#保存#}</button>
<button type="button" class="btn btn-outline-secondary" $onclick="commerceGo('addresses')" >{#取消#}</button>
</div>
</form>
</div>
</Pane>

timeout: 20000
testData: { modal: { open: false } }
cases:
  - name: native focus trap and Escape during opening both close cleanly
    attributes: {id: subject}
    slots: {body: '<input aria-label="Modal field">'}
    actions:
      - script: |
          subject.show();await new Promise(r=>subject.addEventListener('shown.bs.modal',r,{once:true}));
          if(document.activeElement!==subject)throw Error('Modal did not receive native focus');
          subject.hide();await new Promise(r=>subject.addEventListener('hidden.bs.modal',r,{once:true}));
          subject.show();document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
          await new Promise(r=>subject.addEventListener('hidden.bs.modal',r,{once:true}));
    after:
      - script: "return !subject.classList.contains('show')&&!document.querySelector('.modal-backdrop')&&!document.body.classList.contains('modal-open')"
  - name: removal during opening releases backdrop body lock and Bootstrap instance
    attributes: {id: subject}
    slots: {body: '<div>Disposable modal</div>'}
    actions:
      - script: "subject.show();subject.remove();await new Promise(r=>setTimeout(r,800));return true"
    after:
      - script: "return !document.querySelector('.modal-backdrop')&&!document.body.classList.contains('modal-open')&&bootstrap.Modal.getInstance(subject)===null"
  - name: binding show hide and slots
    covers: [methods.hide]
    attributes: { id: subject, "$bind": testData.modal.open, width: 420px, body-height: 120px }
    slots:
      header: '<div>Test header</div>'
      body: '<div>Test body</div>'
      footer: '<button type="button">Done</button>'
    before:
      - dom: { selector: '#subject', containsText: Test body }
      - script: "return subject.querySelector('.modal-dialog').style.width === '420px'"
      - script: "const footer=subject.querySelector('.modal-footer'),slot=footer.firstElementChild; return getComputedStyle(slot).display==='flex' && getComputedStyle(slot).flexGrow==='1'"
    actions:
      - call: { method: show }
      - script: "await new Promise(resolve => { subject.addEventListener('hidden.bs.modal', resolve, { once: true }); subject.hide(true) })"
    after:
      - data: { path: testData.modal.open, equals: false }
      - event: { name: change, count: 1, last: false }
  - name: title type and complete dimensions
    attributes: { id: subject, width: 80vw, max-width: 900px, body-height: 200px, body-min-height: 100px, body-class: p-0, "$.state.title": "'Editor'", "$.state.type": "'warning'" }
    slots:
      body: <div>Content</div>
    before:
      - dom: { selector: '#subject .modal-title', text: Editor }
      - dom: { selector: '#subject .border-warning', count: 1 }
      - script: "return getComputedStyle(subject.querySelector('.modal-body')).padding==='0px' && subject.getAttribute('aria-labelledby')===subject.querySelector('.modal-title').id"
      - script: "return subject.querySelector('[data-bs-dismiss=modal]').getAttribute('aria-label')==='Close dialog'"
      - script: "const d=subject.querySelector('.modal-dialog'),b=subject.querySelector('.modal-body'); return d.style.width==='80vw'&&d.style.maxWidth==='900px'&&b.style.height==='200px'&&b.style.minHeight==='100px'"
    actions: []
    after: []
  - name: static modal disables backdrop and keyboard close
    attributes: { id: subject, static: true }
    slots:
      body: <div>Static</div>
    before:
      - script: "return subject.modal._config.backdrop==='static' && subject.modal._config.keyboard===false"
    actions: []
    after: []
  - name: dirty guard blocks implicit dismissal
    attributes: { id: subject, guard-dirty: true }
    slots:
      body: <input class="dirty-input">
    before:
      - property: { path: subject.guardDirty, equals: true }
    actions:
      - fill: { selector: '#subject .dirty-input', value: Changed }
      - script: "const event=new Event('hide.bs.modal',{cancelable:true}); subject.dispatchEvent(event); if(!event.defaultPrevented) throw new Error('dismiss not blocked')"
    after:
      - property: { path: subject.dirty, equals: true }
      - event: { name: dismissblocked, count: 1 }
  - name: opening edits retain the dirty guard and explicit close completes
    covers: [methods.show, methods.hide]
    attributes: { id: subject, guard-dirty: true }
    slots:
      body: '<div><input class="opening-draft"></div>'
    before: []
    actions:
      - script: |
          await new Promise(resolve => {
            subject.addEventListener('shown.bs.modal', resolve, { once: true })
            subject.show()
            const input = subject.querySelector('.opening-draft')
            input.value = 'Opening edit'
            input.dispatchEvent(new Event('input', { bubbles: true }))
            subject.hide()
          })
          if (!subject.classList.contains('show') || !subject.dirty) throw new Error('opening dismissal lost dirty guard')
      - script: "await new Promise(resolve => { subject.addEventListener('hidden.bs.modal', resolve, { once: true }); subject.hide(true) })"
    after:
      - event: { name: dismissblocked, count: 1 }
      - event: { name: change, count: 1, last: false }

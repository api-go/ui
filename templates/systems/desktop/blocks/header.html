<div class="d-flex flex-nowrap align-items-center gap-2 w-100"><strong class="me-auto text-nowrap"><i class="bi bi-feather text-primary me-2" aria-hidden="true"></i><span class="d-none d-sm-inline">{#云间写作#}</span></strong><select class="form-select w-auto" aria-label="{#工作页面#}" $.value="desktopPage()" $onchange="Hash.go({desktopPage:event.target.value})"><option value="editor">{#笔记#}</option><option value="tasks">{#待办#}</option><option value="history">{#保存历史#}</option><option value="guide">{#取用说明#}</option></select>
 <div class="dropdown"><button class="btn btn-link text-body-secondary px-1" type="button" aria-label="{#外观设置#}" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false"><i class="bi bi-sliders2" aria-hidden="true"></i></button><div class="dropdown-menu dropdown-menu-end p-3"><label class="form-label" for="desktopDensity">{#界面密度#}</label><select id="desktopDensity" class="form-select mb-3" $bind="LocalStorage.desktopDensity"><option value="default">{#默认#}</option><option value="sm">{#紧凑#}</option><option value="lg">{#宽松#}</option></select><label class="d-flex align-items-center gap-2 mb-3"><input class="form-check-input mt-0" type="checkbox" $bind="LocalStorage.desktopLink"><span>{#链接外观#}</span></label><label class="d-flex align-items-center gap-2"><input class="form-check-input mt-0" type="checkbox" $bind="LocalStorage.desktopDark"><span>{#深色模式#}</span></label></div></div>
 <button class="btn btn-link px-1 text-body-secondary" type="button" aria-label="{#返回模板目录#}" $onclick="desktopExit()"><i class="bi bi-grid" aria-hidden="true"></i></button><button class="btn btn-primary" type="button" $disabled="desktop_state.saving||!State.changes.DesktopWorkspace" $onclick="desktopSave()"><i class="bi bi-check-lg me-sm-1" aria-hidden="true"></i><span class="d-none d-sm-inline">{#保存工作区#}</span><span class="d-sm-none">{#保存#}</span></button></div>

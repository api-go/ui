dependencies: [List]
testData: { largeRows: [] }
init:
  - "testData.largeRows=Array.from({length:2000},(_,i)=>({id:'row-'+i,label:'Row '+i}))"
cases:
  - name: content scrolls while optional fixed regions remain visible
    attributes: { id: subject, scroll: auto, style: "height:280px;width:320px;flex:none" }
    slots:
      header: '<h2 class="h5 mb-0">Header</h2>'
      toolbar: '<input class="form-control" aria-label="Search">'
      content: '<div style="min-height:800px">Long content</div>'
      footer: '<button class="btn btn-primary">Save</button>'
    before:
      - dom: { selector: '#subject h2', text: Header }
      - script: "const body=subject.querySelector('[data-pane-content]'); return body.scrollHeight>body.clientHeight && getComputedStyle(body).overflowY==='auto' && subject.scrollHeight===subject.clientHeight"
    actions:
      - script: "subject.querySelector('[data-pane-content]').scrollTop=200"
    after:
      - script: "return subject.querySelector('[data-pane-content]').scrollTop>0 && subject.querySelector('footer').getBoundingClientRect().bottom<=subject.getBoundingClientRect().bottom+1"
  - name: delegate scrolling and omit empty chrome
    attributes: { id: subject, scroll: none, style: "height:200px;width:300px;flex:none" }
    slots:
      content: '<div class="overflow-auto"><div style="height:900px">Nested viewport</div></div>'
    before:
      - script: "return getComputedStyle(subject.querySelector('[data-pane-content]')).overflowY==='hidden' && getComputedStyle(subject.querySelector('header')).display==='none'"
      - script: "const child=subject.querySelector('[data-pane-content]').firstElementChild; return child.clientHeight<child.scrollHeight && child.clientHeight<=200"
  - name: virtual list receives a real bounded viewport
    attributes: { id: subject, scroll: none, style: "height:300px;width:360px;flex:none" }
    slots:
      content: '<List fast $.state.list="testData.largeRows"></List>'
    before:
      - script: "const list=subject.querySelector('List'); return list.clientHeight===300 && list.scrollHeight>list.clientHeight && list.querySelectorAll('.list-group-item').length<2000"
    actions:
      - script: "subject.querySelector('List').scrollTop=20000"
      - wait: 200
    after:
      - script: "const list=subject.querySelector('List'); return list.scrollTop>10000 && !list.textContent.includes('Row 0') && list.querySelectorAll('.list-group-item').length<2000 && subject.scrollHeight===subject.clientHeight"

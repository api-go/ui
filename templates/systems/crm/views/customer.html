<Pane scroll="auto">
<PageHeader slot="header" heading="{#客户详情#}" $.state.description="''">
<template slot="actions">
<button type="button" class="btn btn-outline-secondary" $onclick="crmGo('customer-edit',Hash.crmId)" $if="crmCustomer()">{#编辑客户#}</button>
</template>
</PageHeader>
<div slot="content" class="p-3 p-md-4">
<template $if="crmCustomer()">
<h2 class="h3" $text="crmCustomer()?.name">
</h2>
<dl class="row g-3 my-3">
<div class="col-6 col-lg-3">
<dt class="small text-body-secondary fw-normal">{#联系人#}</dt>
<dd class="mt-1" $text="crmCustomer()?.contact">
</dd>
</div>
<div class="col-6 col-lg-3">
<dt class="small text-body-secondary fw-normal">{#行业#}</dt>
<dd class="mt-1" $text="crmCustomer()?.industry">
</dd>
</div>
<div class="col-6 col-lg-3">
<dt class="small text-body-secondary fw-normal">{#电子邮箱#}</dt>
<dd class="mt-1" $text="crmCustomer()?.email">
</dd>
</div>
<div class="col-6 col-lg-3">
<dt class="small text-body-secondary fw-normal">{#电话#}</dt>
<dd class="mt-1" $text="crmCustomer()?.phone">
</dd>
</div>
</dl>
<p class="text-body-secondary" $text="crmCustomer()?.notes">
</p>
<section class="border-top pt-4 mt-4">
<h2 class="h5">{#跟进记录#}</h2>
<form class="row g-2 align-items-end mb-4" $onsubmit="crmAddActivity(event)">
<div class="col-4 col-md-2">
<label class="d-block">
<span class="form-label">{#类型#}</span>
<select aria-label="{#类型#}" class="form-select" $bind="crm_state.activityType" >
<option value="电话">{#电话#}</option>
<option value="会议">{#会议#}</option>
<option value="邮件">{#邮件#}</option>
</select>
</label>
</div>
<div class="col-8 col-md-8">
<label class="d-block">
<span class="form-label">{#跟进内容#}</span>
<input class="form-control" type="text" $bind="crm_state.activity" required maxlength="500">
</label>
</div>
<div class="col-12 col-md-2">
<button class="btn btn-primary w-100" type="submit">{#记录跟进#}</button>
</div>
</form>
<ol class="list-group list-group-flush">
<li class="list-group-item px-0" $each="crm_state.data.activities.filter(x=>x.customerId===Hash.crmId)" as="activity" key="id">
<div class="small text-body-secondary mb-1" $text="activity.type+' · '+templateDate(activity.time)">
</div>
<p class="mb-0" $text="activity.content">
</p>
</li>
</ol>
</section>
</template>
<div class="alert alert-warning" $if="!(crmCustomer())">{#记录不存在，请返回列表选择。#}</div>
</div>
</Pane>

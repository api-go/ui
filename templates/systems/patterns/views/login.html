<Pane scroll="auto">
<PageHeader slot="header" heading="{#账户入口#}" $.state.description="''">
<template slot="actions">
</template>
</PageHeader>
<div slot="content" class="p-3 p-md-4">
<div class="row justify-content-center">
<section class="col-12 col-md-8 col-lg-6 col-xl-5">
<div class="border rounded p-4">
<i class="bi bi-cloud fs-1 text-primary" aria-hidden="true">
</i>
<h2 class="h3 mt-3 mb-4">{#欢迎回来#}</h2>
<p class="small text-body-secondary">{#只验证表单，请使用虚构邮箱和密码。不会连接认证服务或保存密码。#}</p>
<form $onsubmit="patternsAuth(event,'login')">
<label class="d-block">
<span class="form-label">{#电子邮箱#}</span>
<input class="form-control" type="email" $bind="patterns_state.email" required autocomplete="off">
</label>
<div class="mt-3">
<label class="d-block">
<span class="form-label">{#示例密码#}</span>
<input class="form-control" type="password" $bind="patterns_state.password" required minlength="8" autocomplete="off">
</label>
</div>
<button class="btn btn-primary w-100 mt-4" type="submit">{#演示登录#}</button>
</form>
<div class="d-flex flex-wrap justify-content-between gap-2 mt-3">
<button type="button" class="btn btn-link p-0" $onclick="patternsGo('recovery')" >{#忘记密码#}</button>
<button type="button" class="btn btn-link p-0" $onclick="patternsGo('register')" >{#创建账户#}</button>
</div>
</div>
</section>
</div>
</div>
</Pane>

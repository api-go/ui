<!doctype html>
<html>
<head><meta charset="utf-8"><title>utilities.HTTP tests</title><script src="HTTP.js"></script></head>
<body><button id="runAll">Run all</button><pre id="result"></pre>
<script>
  const cases = ['stream-body', 'retained-headers', 'response-metadata']
  const assert = (result, feature, condition, message) => { result.assertions++; if (condition) result.passed++; else { result.failed++; result.failures.push({ feature, message }) } }
  window.runTest = async () => {
    const result = { name: 'utilities.HTTP', status: 'running', assertions: 0, passed: 0, failed: 0, failures: [], consoleErrors: [], coverage: { tested: [], total: cases, percent: 0 } }
    const originalFetch = globalThis.fetch
    const requests = []
    try {
      HTTP._keepHeadersCache = { 'Session-Id': 'session-test', 'Device-Id': 'device-test' }
      globalThis.fetch = async (url, options) => {
        requests.push({ url, options })
        const body = new ReadableStream({ start(controller) { controller.enqueue(new TextEncoder().encode('data: one\n\n')); controller.close() } })
        return new Response(body, { status: 200, headers: { 'Content-Type': 'text/event-stream', 'Session-Id': 'session-next' } })
      }
      const response = await HTTP.request({ url: '/stream', method: 'POST', data: { stream: true }, responseType: 'stream' })
      const reader = response.result.getReader(), first = await reader.read()
      assert(result, 'stream-body', new TextDecoder().decode(first.value) === 'data: one\n\n' && !first.done, 'stream response remains readable without buffering')
      assert(result, 'retained-headers', requests[0].options.headers['Session-Id'] === 'session-test' && requests[0].options.headers['Device-Id'] === 'device-test' && HTTP._keepHeadersCache['Session-Id'] === 'session-next', 'retained identity headers are sent and refreshed')
      assert(result, 'response-metadata', response.ok && response.status === 200 && response.responseType === 'stream', 'explicit stream response type is reported')
    } finally {
      globalThis.fetch = originalFetch
    }
    result.coverage.tested = [...cases]; result.coverage.percent = 100; result.status = result.failed ? 'failed' : 'passed'; document.querySelector('#result').textContent = JSON.stringify(result, null, 2); return result
  }
  document.querySelector('#runAll').onclick = window.runTest
</script></body></html>

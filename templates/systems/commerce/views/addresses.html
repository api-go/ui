<Pane scroll="auto">
<PageHeader slot="header" heading="{#收货地址#}" $.state.description="''">
<template slot="actions">
<button type="button" class="btn btn-primary" $onclick="commerceGo('address-edit')" >
<i class="bi bi-plus-lg me-1" aria-hidden="true">
</i>{#新增地址#}</button>
</template>
</PageHeader>
<div slot="content" class="p-3 p-md-4">
<div class="row g-3">
<article class="col-12 col-lg-6" $each="commerce_state.data.addresses" as="address" key="id">
<div class="border rounded p-3">
<div class="d-flex justify-content-between gap-3">
<h2 class="h6" $text="address.name">
</h2>
<button type="button" class="btn btn-link" $onclick="commerceGo('address-edit',address.id)" >{#编辑#}</button>
</div>
<p $text="address.phone">
</p>
<p class="text-body-secondary mb-0" $text="address.city+address.street">
</p>
</div>
</article>
</div>
</div>
</Pane>

<div class="flex-fill overflow-auto p-3 p-md-4"><div data-changebind-scope .changebind="AdminProfile"><AutoForm id="adminProfileForm" columns="2" nobutton $.state.data="admin_state.profileDraft" $.state.schema="adminProfileFields" $onsubmit="adminSaveProfile(event)"></AutoForm></div><div class="d-flex flex-wrap gap-2 border-top pt-3 mt-4"><button type="button" class="btn btn-primary" $disabled="admin_state.saving||!State.changes.AdminProfile" $onclick="adminProfileForm.submit()">{#保存资料#}</button><button type="button" class="btn btn-outline-secondary" $disabled="admin_state.saving" $onclick="adminResetDraft('profile')">{#撤销修改#}</button></div><p class="small text-body-secondary mt-3">{#保存后重新打开系统，仍可读取本机已保存的资料。#}</p></div>

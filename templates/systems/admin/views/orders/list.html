<PagedList id="adminOrderList" class="flex-fill" height="100%" searchable sortable $.source="admin_state.orderSource" $.state.sortoptions="[{value:'amount',label:'{#金额升序#}'},{value:'-amount',label:'{#金额降序#}'}]" $.state.columns="[{name:'title',label:'{#订单#}',class:'col-5 col-md-6'},{name:'amount',label:'{#金额#}',class:'col-4 col-md-3',align:'end'},{name:'status',label:'{#状态#}',class:'col-3'}]">
 <template slot="item"><div class="row g-2 align-items-center"><div class="col-5 col-md-6"><button class="btn btn-link p-0 text-start" type="button" $onclick="adminGo({adminPage:'order-detail',adminId:item.id})" $text="item.title"></button><span class="small text-body-secondary d-block" $text="item.id+' · '+item.date"></span></div><div class="col-4 col-md-3 text-end text-break" $text="adminMoney(item.amount)"></div><div class="col-3"><span class="badge bg-secondary-subtle text-secondary-emphasis" $text="item.status"></span></div></div></template>
</PagedList>

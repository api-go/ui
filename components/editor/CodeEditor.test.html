<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>components.editor.CodeEditor tests</title>
  <script src="../../ui.js" components="CodeEditor"></script>
  <script>
    const formData = { config: '{"enabled":true}' }
    const formSchema = [{ name: 'config', label: 'Config', type: 'code', setting: { lang: 'json', style: 'height:180px' } }]
  </script>
</head>
<body>
  <CodeEditor id="javascript" path="src/app.js" value="function run(){&#10;console.log('ok')&#10;}"></CodeEditor>
  <CodeEditor id="markdown" path="docs/README.md" mode="split" wrap toolbar style="height:360px" value="# Preview&#10;&#10;**ready**"></CodeEditor>
  <CodeEditor id="htmlPreview" path="pages/preview.html" mode="preview" style="height:240px"></CodeEditor>
  <div style="position:absolute;left:-10000px;top:0;width:800px">
    <CodeEditor id="json" path="config/app.json" value="{&quot;enabled&quot;:true}"></CodeEditor>
    <CodeEditor id="yaml" path="config/app.yml" value="enabled: true"></CodeEditor>
    <CodeEditor id="llmYaml" path="config/llm.yaml"></CodeEditor>
    <CodeEditor id="python" path="scripts/task.py" value="def run():&#10;  return True"></CodeEditor>
    <CodeEditor id="html" path="pages/index.htm" value="&lt;main&gt;Hello&lt;/main&gt;"></CodeEditor>
    <CodeEditor id="css" path="styles/app.css" value="body { color: red; }"></CodeEditor>
    <CodeEditor id="explicit" path="scripts/task.py" lang="css" readonly theme="dark" value="body{}"></CodeEditor>
    <CodeEditor id="documentEditor" path="scripts/local.py" value="print('local')"></CodeEditor>
    <CodeEditor id="longDocument" path="logs/long.json" style="height:200px"></CodeEditor>
    <AutoForm id="form" nobutton $.state.data="formData" $.state.schema="formSchema"></AutoForm>
  </div>
  <button id="runAll" type="button">测试全部</button><pre id="result"></pre>
  <script>
    const cases = ['languages', 'highlight', 'path-detection', 'lang-precedence', 'value', 'ready-view-focus', 'readonly-theme', 'line-wrap', 'long-document-scroll', 'change-input', 'diagnostics', 'reindent', 'autoform-code', 'editor-document', 'registry', 'on-demand-bundles', 'toolbar-availability', 'toolbar-controls', 'markdown-preview', 'markdown-options', 'preview-modes', 'preview-events', 'html-sandbox', 'html-script-opt-in', 'html-script-manual-refresh', 'html-script-auto']
    const assert = (result, feature, condition, message) => { result.assertions++; if (condition) result.passed++; else { result.failed++; result.failures.push({ feature, message }) } }
    const tick = (ms = 80) => new Promise(resolve => setTimeout(resolve, ms))
    window.runTest = async () => {
      const result = { name: 'components.editor.CodeEditor', status: 'running', assertions: 0, passed: 0, failed: 0, failures: [], consoleErrors: [], coverage: { tested: [], total: cases, percent: 0 } }
      const editors = [...document.querySelectorAll('CodeEditor')]
      await Promise.all(editors.map(editor => editor.ready))
      const languages = ['javascript', 'json', 'yaml', 'python', 'html', 'css', 'markdown']
      assert(result, 'languages', languages.every(name => document.querySelector(`#${name}`).language === name), 'all six normalized languages initialize')
      await tick()
      const unhighlighted = languages.filter(name => !document.querySelector(`#${name} .cm-content span[class]`))
      assert(result, 'highlight', !unhighlighted.length, `all six language parsers produce highlighted tokens; missing=${unhighlighted.join(',')}`)
      assert(result, 'path-detection', CodeMirror.languageFromPath('A/FILE.YAML?version=2') === 'yaml' && CodeMirror.languageFromPath('task.py') === 'python' && CodeMirror.languageFromPath('README.MD') === 'markdown', 'extensions are detected case-insensitively')
      const explicit = document.querySelector('#explicit')
      const json = document.querySelector('#json')
      assert(result, 'lang-precedence', explicit.language === 'css', 'explicit lang overrides the path extension')
      const javascript = document.querySelector('#javascript')
      assert(result, 'value', javascript.value.includes("console.log('ok')") && javascript.getAttribute('value').includes('function'), 'value exposes source text without rewriting the initial attribute')
      assert(result, 'diagnostics', languages.every(name => document.querySelector(`#${name}`).validate().length === 0), 'valid JavaScript, JSON, YAML, Python, HTML, CSS, and Markdown have no parser diagnostics')
      javascript.focus(); await tick()
      assert(result, 'ready-view-focus', javascript.view && javascript.ready instanceof Promise && javascript.view.hasFocus, `ready exposes EditorView and focus focuses it; active=${document.activeElement?.className}`)
      const darkColor = getComputedStyle(explicit.view.dom).backgroundColor, lightColor = getComputedStyle(json.view.dom).backgroundColor
      assert(result, 'readonly-theme', explicit.view.state.readOnly && darkColor !== lightColor, `readonly and dark theme configure the view; readonly=${explicit.view.state.readOnly}, colors=${darkColor}/${lightColor}`)
	  const markdown = document.querySelector('#markdown')
	  assert(result, 'line-wrap', markdown.view.lineWrapping && !javascript.view.lineWrapping, 'wrap affects only the configured editor instance')
	  markdown.setWrap(false); await tick(); assert(result, 'line-wrap', !markdown.view.lineWrapping && !markdown.hasAttribute('wrap'), 'setWrap updates the instance extension and attribute')
	  markdown.setWrap(true); await tick()
      const longDocument = document.querySelector('#longDocument'); longDocument.value = Array.from({ length: 120 }, (_, index) => `{"line":${index}}`).join('\n'); await tick()
      const longScroller = longDocument.querySelector('.cm-scroller')
      const longRoot = longDocument, longWorkspace = longDocument.querySelector('.code-editor-workspace'), longSource = longDocument.querySelector('.code-editor-source'), longHost = longDocument.querySelector('.code-editor-host')
      assert(result, 'long-document-scroll', longDocument.clientHeight >= 190 && longDocument.clientHeight <= 200 && longScroller.clientHeight > 0 && longScroller.clientHeight < longScroller.scrollHeight, `long documents keep the configured editor height and scroll internally; editor=${longDocument.clientHeight}, root=${longRoot.clientHeight}, workspace=${longWorkspace.clientHeight}, source=${longSource.clientHeight}, host=${longHost.clientHeight}, scroller=${longScroller.clientHeight}/${longScroller.scrollHeight}`)
      let changeDetail, inputCount = 0
      javascript.addEventListener('change', event => { changeDetail = event.detail }, { once: true })
      javascript.addEventListener('input', () => { inputCount++ }, { once: true })
      javascript.view.dispatch({ changes: { from: javascript.value.length, insert: '\n// changed' } })
      assert(result, 'change-input', changeDetail.endsWith('// changed') && inputCount === 1, 'interactive edits emit string change detail and a bubbling input event')
      json.value = '{"enabled":}'
      await tick(260)
      assert(result, 'diagnostics', json.validate().length > 0 && json.diagnostics.length > 0 && CodeMirror.diagnosticCount(json.view.state) > 0, 'parser errors update diagnostics and the lint state')
      const llmYaml = document.querySelector('#llmYaml')
      llmYaml.value = `# Unified LLM contract
name: LLM
abstract: true
method: POST
filters: [LLMSession, LLM]
reasoning:
  supported: true
  levels: [none, low, medium, high]
requestSchema:
  - {name: model, label: Model, type: select, options: []}
  - {name: messages, label: Messages, type: textarea, json: true}
test:
  request:
    model: ""
    messages:
      - role: user
        contents:
          - type: text
            content: "Hello"
creation:
  providerProtocols: [openai.chat, openai.responses, anthropic.messages, google.gemini]
`
      await tick(260)
      assert(result, 'diagnostics', llmYaml.validate().length === 0 && llmYaml.diagnostics.length === 0, `valid nested and flow-style YAML has no parser errors; diagnostics=${JSON.stringify(llmYaml.diagnostics)}`)
      javascript.value = "function run(){\nconsole.log('ok')\n}"
      javascript.reindent()
      assert(result, 'reindent', javascript.value.split('\n')[1].startsWith('  '), 'reindent applies language indentation to the complete document')
      const formEditor = document.querySelector('#form CodeEditor')
      formEditor.view.dispatch({ changes: { from: 0, to: formEditor.value.length, insert: '{"enabled":false}' } })
      await tick()
      assert(result, 'autoform-code', formEditor.language === 'json' && document.querySelector('#form').data.config === '{"enabled":false}' && !formEditor.documentMode, 'AutoForm type code binds a string CodeEditor without document mode')
      const documentEditor = document.querySelector('#documentEditor')
      documentEditor.view.dispatch({ changes: { from: documentEditor.value.length, insert: '\nprint(2)' } })
      let saveDetail; documentEditor.addEventListener('save', event => { saveDetail = event.detail }, { once: true })
      const saved = await documentEditor.save()
      assert(result, 'editor-document', documentEditor.documentMode && saved === saveDetail && saved.type === 'code' && saved.data.endsWith('print(2)'), 'path enables stateless Editor document load/save behavior with string data')
      assert(result, 'registry', ['js', 'json', 'yaml', 'py', 'html', 'css', 'md'].every(extension => Editor.resolve({ path: `file.${extension}` })?.component === 'CodeEditor'), 'Editor registry resolves every supported extension')
      const resources = performance.getEntriesByType('resource').map(entry => new URL(entry.name).pathname)
      assert(result, 'on-demand-bundles', languages.every(name => resources.some(path => path.endsWith(`/libraries/CodeMirror${{ javascript: 'JavaScript', json: 'JSON', yaml: 'YAML', python: 'Python', html: 'HTML', css: 'CSS', markdown: 'Markdown' }[name]}.js`))), 'each requested language loads its independent classic-script bundle')
      let availabilityTools
      javascript.addEventListener('toolschange', event => { availabilityTools = event.detail })
      javascript.state.path = 'pages/runtime.html'; await tick(350)
      const availableViewTools = availabilityTools?.filter(tool => tool.group === 'view' && !tool.hidden) || []
      assert(result, 'toolbar-availability', ['source', 'split-vertical', 'split-horizontal', 'preview', 'wrap'].every(id => availableViewTools.some(tool => tool.id === id)), `toolschange republishes preview tools after asynchronous language detection; tools=${availableViewTools.map(tool => tool.id).join(',')}`)
      javascript.state.path = 'src/app.js'; await tick(180)
      const prettyButton = markdown.querySelector('[data-tool="pretty"]'), fullscreenIcon = markdown.querySelector('[data-tool="fullscreen"] i')
      const viewButtons = [...markdown.querySelectorAll('[data-view-tool]')]
      assert(result, 'toolbar-controls', viewButtons.length === 4 && viewButtons.every(button => button.querySelector('i') && !button.textContent.trim()) && prettyButton?.title === 'Pretty' && !prettyButton.textContent.trim() && prettyButton.querySelector('.bi-stars') && parseFloat(getComputedStyle(fullscreenIcon).fontSize) < parseFloat(getComputedStyle(prettyButton).fontSize), 'the compact toolbar exposes four icon-only view choices, Pretty as a tooltip, and a visually normalized fullscreen glyph')
      await markdown.refreshPreview()
      assert(result, 'markdown-preview', markdown.querySelector('.code-editor-markdown h1')?.textContent === 'Preview' && markdown.querySelector('.code-editor-markdown strong')?.textContent === 'ready', 'Markdown split preview uses the shared safe renderer')
      markdown.value = '# Updated'
      await tick(260)
      assert(result, 'markdown-preview', markdown.querySelector('.code-editor-markdown h1')?.textContent === 'Updated' && performance.getEntriesByType('resource').some(entry => new URL(entry.name).pathname.endsWith('/libraries/Markdown.js')), 'Markdown preview refreshes and loads its renderer on demand')
      markdown.setAttribute('allowhtml', ''); markdown.setAttribute('breaks', '')
      markdown.value = 'one\ntwo\n\n<mark onclick="window.__unsafe=true">safe</mark><script>window.__unsafe=true<\/script>'
      await tick(260)
      assert(result, 'markdown-options', markdown.querySelector('.code-editor-markdown br') && markdown.querySelector('.code-editor-markdown mark')?.textContent === 'safe' && !markdown.querySelector('.code-editor-markdown [onclick], .code-editor-markdown script') && !window.__unsafe, 'Markdown preview supports breaks and sanitized raw HTML opt-in')
      let modeDetail, previewDetail
      markdown.addEventListener('modechange', event => { modeDetail = event.detail }, { once: true })
      markdown.addEventListener('preview', event => { previewDetail = event.detail }, { once: true })
      markdown.mode = 'preview'; await tick()
      const previewOnly = markdown.mode === 'preview' && markdown.querySelector('.code-editor-source').hidden && !markdown.querySelector('.code-editor-preview').hidden
      markdown.setMode('source'); await tick()
      assert(result, 'preview-modes', previewOnly && markdown.mode === 'source' && !markdown.querySelector('.code-editor-source').hidden && markdown.querySelector('.code-editor-preview').hidden, 'source, split, and preview modes switch panes')
      assert(result, 'preview-events', modeDetail === 'preview' && previewDetail?.language === 'markdown', 'modechange and preview events expose their public details')
      const htmlPreview = document.querySelector('#htmlPreview')
      let scriptRuns = 0
      const onMessage = event => { if (event.data === 'html-script-ran') scriptRuns++ }
      window.addEventListener('message', onMessage)
      htmlPreview.value = '<h1>HTML</h1><script>parent.postMessage("html-script-ran", "*")<\/script>'
      await htmlPreview.refreshPreview(); await tick(120)
      const iframe = htmlPreview.querySelector('iframe')
      assert(result, 'html-sandbox', iframe.srcdoc.includes('<h1>HTML</h1>') && iframe.getAttribute('sandbox') === '' && scriptRuns === 0, 'HTML renders in a sandbox and scripts are disabled by default')
      htmlPreview.setAttribute('previewscripts', '')
      await tick(160)
      assert(result, 'html-script-opt-in', iframe.getAttribute('sandbox') === 'allow-scripts' && !iframe.sandbox.contains('allow-same-origin') && scriptRuns === 1, 'previewscripts executes inside an opaque-origin sandbox without same-origin access')
      htmlPreview.value = htmlPreview.value.replace('HTML</h1>', 'Changed</h1>')
      await tick(260)
      const didNotAutoRun = scriptRuns === 1 && htmlPreview.classList.contains('code-editor-preview-stale')
      await htmlPreview.refreshPreview(); await tick(160)
      assert(result, 'html-script-manual-refresh', didNotAutoRun && scriptRuns === 2 && !htmlPreview.classList.contains('code-editor-preview-stale'), 'script-enabled HTML waits for explicit refresh after edits')
      htmlPreview.setAttribute('previewauto', '')
      htmlPreview.value = htmlPreview.value.replace('Changed</h1>', 'Automatic</h1>')
      await tick(360)
      assert(result, 'html-script-auto', scriptRuns === 3 && iframe.srcdoc.includes('Automatic</h1>'), 'previewauto explicitly reruns script-enabled HTML after edits')
      window.removeEventListener('message', onMessage)
      result.coverage.tested = [...cases]; result.coverage.percent = 100; result.status = result.failed ? 'failed' : 'passed'; document.querySelector('#result').textContent = JSON.stringify(result, null, 2); return result
    }
    document.querySelector('#runAll').onclick = window.runTest
  </script>
</body>
</html>

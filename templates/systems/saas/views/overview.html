<Pane scroll="auto">
<PageHeader slot="header" heading="{#组织概览#}" $.state.description="'{#管理团队成员、角色与组织资料。#}'">
<template slot="actions">
</template>
</PageHeader>
<div slot="content" class="p-3 p-md-4">
<div class="row g-3 mb-4">
<div class="col-6 col-xl-3">
<section class="border rounded p-3 h-100">
<div class="small text-body-secondary mb-2">{#团队成员#}</div>
<div class="h3 mb-0" $text="saas_state.data.members.length">
</div>
</section>
</div>
<div class="col-6 col-xl-3">
<section class="border rounded p-3 h-100">
<div class="small text-body-secondary mb-2">{#待接受邀请#}</div>
<div class="h3 mb-0" $text="saas_state.data.members.filter(x=>x.status==='待接受').length">
</div>
</section>
</div>
<div class="col-6 col-xl-3">
<section class="border rounded p-3 h-100">
<div class="small text-body-secondary mb-2">{#角色#}</div>
<div class="h3 mb-0" $text="saas_state.data.roles.length">
</div>
</section>
</div>
<div class="col-6 col-xl-3">
<section class="border rounded p-3 h-100">
<div class="small text-body-secondary mb-2">{#本机操作记录#}</div>
<div class="h3 mb-0" $text="saas_state.data.audit.length">
</div>
</section>
</div>
</div>
<div class="row g-4">
<section class="col-12 col-lg-7">
<div class="border rounded p-3">
<h2 class="h5" $text="saas_state.data.organization.name">
</h2>
<p class="text-body-secondary" $text="saas_state.data.organization.domain">
</p>
<button type="button" class="btn btn-outline-secondary" $onclick="saasGo('preferences')" >{#组织设置#}</button>
</div>
</section>
<section class="col-12 col-lg-5">
<div class="border rounded p-3">
<span class="badge bg-primary-subtle text-primary-emphasis mb-2">{#团队版#}</span>
<h2 class="h5">{#团队协作空间#}</h2>
<p class="text-body-secondary">{#查看成员、角色配置和账单示例。#}</p>
<button type="button" class="btn btn-outline-primary" $onclick="saasGo('billing')" >{#查看账单#}</button>
</div>
</section>
</div>
</div>
</Pane>

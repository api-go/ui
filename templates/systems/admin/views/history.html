<div class="flex-fill overflow-auto p-3 p-md-4"><form class="ui-toolbar ui-toolbar-fields d-flex flex-wrap align-items-center gap-2 mb-3" role="search" $aria-label="'{#操作记录搜索#}'" data-no-changebind $onsubmit="event.preventDefault();Hash.go({adminHistory:admin_state.historyDraft||null})"><input class="form-control w-auto flex-grow-1" type="search" $aria-label="'{#搜索操作记录#}'" $placeholder="'{#搜索操作或内容#}'" $bind="admin_state.historyDraft"><button class="btn btn-primary" type="submit"><i class="bi bi-search me-1" aria-hidden="true"></i>{#搜索#}</button></form><ol class="list-unstyled mb-0"><li class="border-bottom py-3" $each="adminHistory()" as="activity" key="id"><strong $text="activity.label"></strong><p class="mb-1 mt-1 text-break" $text="activity.detail"></p><time class="small text-body-secondary" $text="adminDate(activity.time)"></time></li></ol><p class="text-body-secondary py-4" $if="!adminHistory().length">{#没有匹配记录，清空条件后重新搜索。#}</p></div>

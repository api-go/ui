<Pane scroll="auto">
<PageHeader slot="header" heading="{#项目概览#}" $.state.description="''">
<template slot="actions">
<button type="button" class="btn btn-primary" $onclick="projectsGo('editor')" >
<i class="bi bi-plus-lg me-1" aria-hidden="true">
</i>{#新增任务#}</button>
</template>
</PageHeader>
<div slot="content" class="p-3 p-md-4">
<div class="row g-3 mb-4">
<div class="col-6 col-xl-3">
<section class="border rounded p-3 h-100">
<div class="small text-body-secondary mb-2">{#总任务#}</div>
<div class="h3 mb-0" $text="projectsTasks().length">
</div>
</section>
</div>
<div class="col-6 col-xl-3">
<section class="border rounded p-3 h-100">
<div class="small text-body-secondary mb-2">{#进行中#}</div>
<div class="h3 mb-0" $text="projectsTasks().filter(x=>x.columnId==='doing').length">
</div>
</section>
</div>
<div class="col-6 col-xl-3">
<section class="border rounded p-3 h-100">
<div class="small text-body-secondary mb-2">{#已完成#}</div>
<div class="h3 mb-0" $text="projectsTasks().filter(x=>x.columnId==='done').length">
</div>
</section>
</div>
<div class="col-6 col-xl-3">
<section class="border rounded p-3 h-100">
<div class="small text-body-secondary mb-2">{#高优先级#}</div>
<div class="h3 mb-0" $text="projectsTasks().filter(x=>x.priority==='高'&&x.columnId!=='done').length">
</div>
</section>
</div>
</div>
<div class="row g-4">
<section class="col-12 col-lg-8">
<h2 class="h5">{#近期任务#}</h2>
<div class="table-responsive">
<table class="table align-middle text-nowrap">
<thead>
<tr>
<th scope="col">{#任务#}</th>
<th scope="col">{#负责人#}</th>
<th scope="col">{#截止日期#}</th>
<th scope="col">{#阶段#}</th>
</tr>
</thead>
<tbody>
<tr $each="projectsTasks()" as="row" key="id">
<td>
<button class="btn btn-link p-0 text-start" $text="row.title" $onclick="projectsGo('detail',row.id)">
</button>
</td>
<td class="" $text="row.owner">
</td>
<td class="" $text="row.due">
</td>
<td class="" $text="row.stage">
</td>
</tr>
</tbody>
</table>
</div>
</section>
<aside class="col-12 col-lg-4">
<div class="border rounded p-3">
<h2 class="h5">{#交付目标#}</h2>
<p class="text-body-secondary">{#用可验证的客户任务验收模板，覆盖手机与桌面。#}</p>
<button type="button" class="btn btn-outline-primary" $onclick="projectsGo('board')" >{#打开看板#}</button>
</div>
</aside>
</div>
</div>
</Pane>

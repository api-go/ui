<Pane><div slot="header"><PageHeader heading="{#项目待办#}" description="{#与笔记共用一次保存；切换页面不会丢弃修改。#}"></PageHeader></div><form slot="toolbar" class="d-flex gap-2" $onsubmit="event.preventDefault();desktopAddTask()"><input type="text" class="form-control" required maxlength="160" aria-label="{#新待办#}" placeholder="{#写下下一步#}" $bind="desktop_state.taskTitle"><button type="submit" class="btn btn-primary text-nowrap">{#添加#}</button></form><div slot="content" class="p-3"><p class="small text-body-secondary"><span $text="desktop_state.tasks.filter(task=>!task.done).length"></span> {#项待完成#}</p><div class="list-group"><label class="list-group-item d-flex align-items-start gap-3 py-3" $each="desktop_state.tasks" as="task" key="id"><input class="form-check-input mt-1 flex-shrink-0" type="checkbox" $bind="task.done" $onchange="desktopChanged()"><span class="text-break" $class="task.done?'text-decoration-line-through text-body-secondary':''" $text="task.title"></span></label></div></div></Pane>

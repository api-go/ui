<Pane scroll="auto">
<PageHeader slot="header" heading="{#费用汇总#}" $.state.description="''">
<template slot="actions">
<button type="button" class="btn btn-outline-secondary" $onclick="templateDownload('expenses.json',office_state.data.requests.filter(x=>x.type!=='请假'))" >{#下载汇总#}</button>
</template>
</PageHeader>
<div slot="content" class="p-3 p-md-4">
<div class="row g-3 mb-4">
<div class="col-6 col-xl-3">
<section class="border rounded p-3 h-100">
<div class="small text-body-secondary mb-2">{#待审批金额#}</div>
<div class="h3 mb-0" $text="templateMoney(office_state.data.requests.filter(x=>x.type!=='请假'&&x.status==='待审批').reduce((n,x)=>n+x.amount,0))">
</div>
</section>
</div>
<div class="col-6 col-xl-3">
<section class="border rounded p-3 h-100">
<div class="small text-body-secondary mb-2">{#已通过金额#}</div>
<div class="h3 mb-0" $text="templateMoney(office_state.data.requests.filter(x=>x.type!=='请假'&&x.status==='已通过').reduce((n,x)=>n+x.amount,0))">
</div>
</section>
</div>
</div>
<div class="table-responsive">
<table class="table align-middle text-nowrap">
<thead>
<tr>
<th scope="col">{#申请#}</th>
<th scope="col">{#申请人#}</th>
<th scope="col">{#金额#}</th>
<th scope="col">{#状态#}</th>
</tr>
</thead>
<tbody>
<tr $each="office_state.data.requests.filter(x=>x.type!=='请假')" as="row" key="id">
<td>
<button class="btn btn-link p-0 text-start" $text="row.name" $onclick="officeGo('detail',row.id)">
</button>
</td>
<td class="" $text="row.applicant">
</td>
<td class="text-end" $text="templateMoney(row.amount)">
</td>
<td class="" $text="row.status">
</td>
</tr>
</tbody>
</table>
</div>
</div>
</Pane>

<div class="flex-fill overflow-auto p-3 p-md-4"><section class="mb-4"><h2 class="h6">{#读取状态#}</h2><p class="text-body-secondary">{#本页使用 RequestState 展示演示延时、空态、读取失败与保留已有结果。#}</p><div class="d-flex flex-wrap gap-2 mb-3"><button class="btn btn-primary" type="button" $disabled="admin_state.read.loading" $onclick="adminRead()">{#读取示例#}</button><button class="btn btn-outline-secondary" type="button" $disabled="admin_state.read.loading" $onclick="adminRead(true)">{#模拟读取失败#}</button><button class="btn btn-outline-secondary" type="button" $disabled="admin_state.read.loading" $onclick="adminRead(false,true)">{#显示空结果#}</button></div><RequestState $.state.loading="admin_state.read.loading" $.state.error="admin_state.read.error" $.state.empty="admin_state.read.empty" $.state.hasdata="admin_state.read.hasdata" $onretry="adminRead()"><p slot="content" class="mb-0" $text="admin_state.readResult"></p><div slot="empty"><p>{#没有匹配的数据。#}</p><button class="btn btn-link p-0" type="button" $onclick="adminRead()">{#重新读取#}</button></div></RequestState></section><section class="border-top pt-4 mb-4"><h2 class="h6">{#保存失败恢复#}</h2><label class="d-flex align-items-start gap-2"><input type="checkbox" class="form-check-input flex-shrink-0" $bind="admin_state.failNextSave">{#模拟下一次本地保存失败（一次后自动关闭）#}</label><p class="small text-body-secondary mt-2">{#开启后编辑个人资料并保存；草稿和错误将保持，可再次保存重试。#}</p><button class="btn btn-outline-secondary" type="button" $onclick="adminGo({adminPage:'profile'})">{#编辑个人资料#}</button></section><section class="border-top pt-4"><h2 class="h6">{#本地数据边界#}</h2><p class="text-body-secondary">{#所有数据均为虚构示例。重置只替换本浏览器的后台模板数据，不影响其他模板或实际系统。#}</p><button class="btn btn-outline-danger" type="button" $onclick="adminResetDemo()">{#重置示例数据#}</button></section></div>

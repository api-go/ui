<Pane>
 <ol slot="toolbar" class="list-unstyled d-flex flex-wrap gap-2 mb-0" aria-label="{#创建步骤#}"><li $each="adminCreateSteps" as="step" index="stepIndex"><button class="btn" type="button" $class="adminCreateStep()===stepIndex?'btn-primary':'btn-outline-secondary'" $aria-current="adminCreateStep()===stepIndex?'step':null" $disabled="stepIndex>adminCreateStep()||admin_state.saving" $onclick="Hash.go({adminCreateStep:stepIndex})" $text="(stepIndex+1)+'. '+step"></button></li></ol>
 <div slot="content" class="p-3 p-md-4">
  <div $if="admin_state.customerDraftId!=='new'" class="alert alert-warning"><p>{#另一条记录有未保存的草稿，已保留。#}</p><button type="button" class="btn btn-outline-secondary" $onclick="adminResumeDraft()">{#继续原草稿#}</button></div>
  <template $if="admin_state.customerDraftId==='new'"><p class="small text-body-secondary">{#三个步骤共用一份草稿；返回或切换布局保留输入，最后一步才写入本机。刷新只恢复步骤地址，未保存字段不会进入链接。#}</p>
   <div data-changebind-scope .changebind="AdminCustomer" $if="adminCreateStep()<2"><AutoForm id="adminCreateForm" columns="2" nobutton $.state.data="admin_state.customerDraft" $.state.schema="adminCreateFields()" $.validator="adminCreateStep()===0?adminValidateCustomer:()=>({})" $onsubmit="event.preventDefault();Hash.go({adminCreateStep:adminCreateStep()+1})"></AutoForm></div>
   <section $if="adminCreateStep()===2"><h2 class="h5">{#核对客户资料#}</h2><dl class="row g-3"><div class="col-12 col-md-6" $each="adminCustomerFields" as="field" key="name"><dt class="small fw-normal text-body-secondary" $text="field.label"></dt><dd class="mb-0 text-break" $text="admin_state.customerDraft[field.name]||'{#未提供#}'"></dd></div></dl></section>
  </template>
 </div>
 <div slot="footer" class="d-flex flex-wrap align-items-center gap-2"><button class="btn btn-outline-secondary" type="button" $disabled="admin_state.saving" $if="adminCreateStep()>0" $onclick="Hash.go({adminCreateStep:adminCreateStep()-1})">{#上一步#}</button><button class="btn btn-link text-body-secondary" type="button" $disabled="admin_state.saving" $onclick="adminGo({adminPage:'customers'})">{#取消创建#}</button><span class="flex-fill"></span><button class="btn btn-primary" type="button" $if="adminCreateStep()<2&&admin_state.customerDraftId==='new'" $onclick="adminCreateForm.submit()">{#下一步#}</button><button class="btn btn-primary" type="button" $if="adminCreateStep()===2&&admin_state.customerDraftId==='new'" $disabled="admin_state.saving" $onclick="adminCreateFinish()">{#确认创建#}</button></div>
</Pane>

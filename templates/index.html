<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="color-scheme" content="dark light"><meta name="viewport" content="width=device-width,initial-scale=1"><title>应用模板 · 从完整系统开始</title>
<script src="../frameworks/State.js"></script><script src="../frameworks/Bootstrap.js"></script>
<script>
const templateCatalog=[
  {
    "id": "admin",
    "type": "workspace",
    "title": "{#云间工作台 · 后台管理#}",
    "description": "{#三种导航共用客户、订单、导入导出及设置 View。#}",
    "entry": "systems/admin/index.html",
    "manifest": "systems/admin/manifest.json",
    "guide": "systems/admin/README.md",
    "status": "ready",
    "layouts": 3,
    "scenarios": [
      "{#后台管理#}",
      "{#客户与订单#}",
      "{#多步骤导入#}"
    ],
    "preview": "systems/admin/assets/preview.png"
  },
  {
    "id": "mobile",
    "type": "mobile",
    "title": "{#云间随行 · 移动应用#}",
    "description": "{#同一导航数据自动呈现为底栏、图标侧栏或完整侧栏；共用后台业务 View。#}",
    "entry": "systems/mobile/index.html",
    "manifest": "systems/mobile/manifest.json",
    "guide": "systems/mobile/README.md",
    "status": "ready",
    "layouts": 1,
    "scenarios": [
      "{#移动业务#}",
      "{#搜索与筛选#}",
      "{#详情与表单#}"
    ],
    "preview": "systems/mobile/assets/preview.png"
  },
  {
    "id": "desktop",
    "type": "interactive",
    "title": "{#云间写作 · 桌面工作台#}",
    "description": "{#资源列表、编辑与预览共用工作区；窄屏列表抽屉，多份草稿统一保存。#}",
    "entry": "systems/desktop/index.html",
    "manifest": "systems/desktop/manifest.json",
    "guide": "systems/desktop/README.md",
    "status": "ready",
    "layouts": 1,
    "scenarios": [
      "{#多面板#}",
      "{#编辑与预览#}",
      "{#多草稿保存#}"
    ],
    "preview": "systems/desktop/assets/preview.png"
  }
]
function matchingTemplates(){const query=(typeof Hash.templateSearch==='string'?Hash.templateSearch:'').trim().toLowerCase();return templateCatalog.filter(entry=>(!Hash.templateType||entry.type===Hash.templateType)&&(!query||(entry.title+' '+entry.description+' '+entry.scenarios.join(' ')).toLowerCase().includes(query)))}
</script></head><body class="m-0 bg-body-tertiary">
<main class="container py-4 py-md-5">
<header class="mb-4"><span class="badge bg-primary-subtle text-primary-emphasis mb-3">{#应用模板#}</span><h1 class="display-6 fw-semibold">{#从一套能操作的系统开始#}</h1><p class="lead text-body-secondary">{#按场景选择，进入独立系统，体验布局与业务交互。#}</p><a href="README.md">{#AI 取用指南：选择系统 → 布局 → View#}</a></header>
<section class="mb-4" aria-label="{#查找模板#}"><div class="row g-3 align-items-end"><div class="col-12 col-md-8"><label class="form-label" for="catalogSearch">{#场景或关键词#}</label><input class="form-control" id="catalogSearch" type="search" placeholder="{#例如：导入、移动、编辑、多面板#}" $bind="Hash.templateSearch"></div><div class="col-12 col-md-4"><label class="form-label" for="catalogType">{#应用类型#}</label><select class="form-select" id="catalogType" $.value="Hash.templateType||''" $onchange="Hash.go({templateType:event.target.value||null})"><option value="">{#全部#}</option><option value="workspace">{#后台管理#}</option><option value="mobile">{#移动应用#}</option><option value="interactive">{#桌面工作台#}</option></select></div></div></section>
<section aria-labelledby="readyHeading"><h2 id="readyHeading" class="h5 mb-3">{#可用系统#} <span class="text-body-secondary fw-normal" $text="matchingTemplates().length"></span></h2><div class="row g-4"><article class="col-12 col-lg-6 col-xxl-4" $each="matchingTemplates()" as="entry" key="id"><div class="card h-100"><a $href="entry.entry" tabindex="-1" aria-hidden="true"><div class="ratio ratio-16x9 border-bottom bg-body-tertiary"><img class="w-100 h-100 object-fit-contain" $src="entry.preview" alt="" loading="lazy" width="640" height="400"></div></a><div class="card-body d-flex flex-column"><h3 class="h4" $text="entry.title"></h3><p class="text-body-secondary" $text="entry.description"></p><p class="small text-body-secondary" $text="entry.layouts+' {#种布局#} · '+entry.scenarios.join(' / ')"></p><div class="mt-auto d-flex flex-wrap gap-2"><a class="btn btn-primary" $href="entry.entry">{#进入系统#}<i class="bi bi-arrow-right ms-1" aria-hidden="true"></i></a><a class="btn btn-outline-secondary" $href="entry.guide">{#取用说明#}</a><a class="btn btn-link" $href="entry.manifest">{#源文件清单#}</a></div></div></div></article></div><div class="p-4 border rounded bg-body" $if="!matchingTemplates().length"><p>{#没有匹配的模板，请换个关键词或应用类型。#}</p><button type="button" class="btn btn-outline-secondary" $onclick="Hash.go({templateSearch:null,templateType:null})">{#查看全部#}</button></div></section>
<section class="mt-5"><h2 class="h5">{#尚待覆盖#}</h2><p class="text-body-secondary">{#内容阅读、展示网站、商品与交易系统仍在计划中，不作为已发布入口。#}</p><p class="small text-body-secondary mb-0">{#当前系统使用虚构数据和本机存储，无生产认证、上传服务或支付。预览通过同源 HTTP(S) 加载 View。#}</p></section>
</main></body></html>

<div class="flex-fill overflow-auto p-3 p-md-4">
 <button $if="!globalThis.templateHost?.headerBack" class="btn btn-link px-0 mb-3" type="button" $onclick="adminGo({adminPage:'tasks'})"><i class="bi bi-arrow-left me-1" aria-hidden="true"></i>{#返回任务列表#}</button>
 <template $if="adminTask()"><h2 class="h5" $text="adminTask()?.label"></h2><p class="text-body-secondary" $text="adminDate(adminTask()?.time)"></p><div class="alert" role="status" $class="adminTask()?.status==='partial'?'alert-warning':'alert-success'"><strong $text="adminTask()?.count+' {#项完成#}'"></strong><span $if="adminTask()?.kind==='import'" $text="' · '+adminTask()?.skipped+' {#行跳过#}'"></span><span $if="adminTask()?.kind==='bulk'" $text="' · '+adminTask()?.rows.filter(row=>row.status==='skipped').length+' {#项跳过#} · '+adminTask()?.rows.filter(row=>row.status==='failed').length+' {#项失败#}'"></span></div>
  <div class="d-flex flex-wrap gap-2 mb-3"><button class="btn btn-primary" type="button" $if="adminTask()?.kind==='export'" $onclick="adminDownload(adminTask().rows,adminTask().filename)">{#再次下载文件#}</button><button class="btn btn-outline-secondary" type="button" $onclick="adminGo({adminPage:'customers'})">{#查看客户#}</button></div>
  <p class="small text-body-secondary" $if="adminTask()?.kind==='export'">{#这是生成文件时的快照，再次下载不会重新查询。浏览器若拦截自动下载，可使用上方按钮。#}</p>
  <ul class="list-group list-group-flush" $if="adminTask()?.kind!=='export'"><li class="list-group-item px-0" $each="adminTask()?.rows||[]" as="result" key="id"><div class="d-flex flex-wrap justify-content-between gap-2"><button type="button" class="btn btn-link p-0 text-start text-break" $disabled="result.status==='failed'" $onclick="adminGo({adminPage:'customer-detail',adminId:result.id})" $text="result.name"></button><span class="text-body-secondary small" $text="result.message||'{#已新增#}'"></span></div></li></ul>
 </template>
 <div class="alert alert-warning" $if="!adminTask()"><h2 class="h6">{#任务记录不可用#}</h2><p class="mb-0">{#该结果可能已被清理，或属于另一个浏览器。请返回列表查看当前本机记录。#}</p></div>
</div>

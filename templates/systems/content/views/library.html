<Pane scroll="none">
<PageHeader slot="header" heading="{#知识与内容#}" $.state.description="''">
<template slot="actions">
<button type="button" class="btn btn-primary" $onclick="contentGo('editor')" >
<i class="bi bi-plus-lg me-1" aria-hidden="true">
</i>{#新建文档#}</button>
</template>
</PageHeader>
<div slot="content" class="d-flex flex-column overflow-hidden">
<PagedList id="content_stateList" searchable sortable  height="100%" $.source="content_state.source" $.state.columns="[{name:'name',label:'{#文档#}',class:'col-7'},{name:'status',label:'{#发布状态#}',class:'col-5'}]" $.state.sortoptions="[{value:'name',label:'{#名称#}'},{value:'-name',label:'{#名称倒序#}'}]">
<template slot="item">
<div class="row g-2 align-items-center">
<div class="col-7">
<button type="button" class="btn btn-link p-0 text-start" $text="item.name" $onclick="contentGo('article',item.id)">
</button>
<span class="d-block small text-body-secondary" $text="item.category+' · '+item.author">
</span>
</div>
<div class="col-5">
<span class="badge bg-secondary-subtle text-secondary-emphasis" $text="item.status">
</span>
</div>
</div>
</template>
</PagedList>
</div>
</Pane>
